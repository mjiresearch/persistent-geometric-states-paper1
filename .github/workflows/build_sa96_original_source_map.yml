name: Build Sanders 1996 original source map

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build_sa96_original_source_map.yml
      - scripts/stationary/build_sa96_original_source_map.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build source map
        run: python scripts/stationary/build_sa96_original_source_map.py
      - name: Commit generated map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stationary/source_reconstruction/sa96_original_source_map_v1.csv \
                  validation/stationary/sa96_original_source_map_v1_summary.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build Sanders 1996 original source map"
            git pull --rebase origin main
            git push
          fi
