name: Summarize SDSS DR20 BOSS epoch support
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/summarize_sdss_dr20_boss_epochs.py'
      - '.github/workflows/run-sdss-dr20-boss-epoch-summary.yml'
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/summarize_sdss_dr20_boss_epochs.py
      - name: Commit summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/osc_rv_target_rank/sdss_dr20_recovery/sdss_dr20_epoch_support_summary.json
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze SDSS DR20 BOSS epoch support summary'
            git pull --rebase origin main
            git push
          fi
