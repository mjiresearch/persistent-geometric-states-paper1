name: Reconcile public HI source overlay

on:
  push:
    branches: [main]
    paths:
      - "scripts/stationary/reconcile_public_hi_source_overlay_v1.py"
      - "data/stationary/source_reconstruction/stationary_public_hi_source_overlay_v1.csv"
      - ".github/workflows/reconcile_public_hi_source_overlay.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build reconciled provenance view
        run: |
          python scripts/stationary/reconcile_public_hi_source_overlay_v1.py

      - name: Show reconciliation summary
        run: |
          cat validation/stationary/stationary_hi_profile_provenance_reconciled_v1_summary.json

      - name: Commit reconciled products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/stationary/source_reconstruction/stationary_hi_profile_provenance_reconciled_v1.csv \
            validation/stationary/stationary_hi_profile_provenance_reconciled_v1_summary.json
          if git diff --cached --quiet; then
            echo "No reconciled changes to commit."
          else
            git commit -m "Reconcile public HI source acquisition status"
            git push origin HEAD:main
          fi
