name: Run frozen SDSS DR20 OSC target discovery
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/discover_sdss_dr20_osc_targets.py'
      - 'data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/SDSS_DR20_OSC_RV_RECOVERY_FREEZE.md'
      - '.github/workflows/run-sdss-dr20-osc-target-discovery.yml'
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pandas requests
      - name: Discover outcome-blind SDSS DR20 matches
        run: python data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/discover_sdss_dr20_osc_targets.py
      - name: Commit immutable discovery products
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/osc_rv_target_rank/sdss_dr20_recovery
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze SDSS DR20 OSC target discovery outputs'
            git pull --rebase origin main
            git push
          fi
