name: Inspect Ge04 Figure 2 axis geometry
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/stationary/inspect_ge04_fig2_axis_geometry.py'
      - '.github/workflows/inspect_ge04_fig2_axis_geometry.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stationary/inspect_ge04_fig2_axis_geometry.py
      - name: Commit axis geometry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/ge04_fig2_axis_geometry_v1.json
          if git diff --cached --quiet; then echo 'No changes'; else
            git commit -m 'Inspect Ge04 Figure 2 axis geometry'
            for attempt in 1 2 3; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep 2; done
            exit 1
          fi
