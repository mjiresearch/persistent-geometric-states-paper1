name: Query OSC candidate SIMBAD RVs
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/query_osc_candidate_simbad_rvs.py'
      - '.github/workflows/query-osc-candidate-simbad-rvs.yml'
permissions:
  contents: write
jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas requests
      - name: Query SIMBAD
        run: python data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/query_osc_candidate_simbad_rvs.py
      - name: Commit lookup products
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/osc_rv_target_rank/simbad_lookup
          if ! git diff --cached --quiet; then
            git commit -m 'Add SIMBAD lookup for OSC RV targets'
            git push
          fi
