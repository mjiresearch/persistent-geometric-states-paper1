name: Audit Fr11 HI profile source assets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/stationary/audit_fr11_hi_profile_source_assets.py'
      - '.github/workflows/audit_fr11_hi_profile_source_assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Fr11 arXiv source package
        run: python scripts/stationary/audit_fr11_hi_profile_source_assets.py
      - name: Commit Fr11 source audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/fr11_hi_profile_source_asset_audit_v1.json
          if git diff --cached --quiet; then echo 'No changes'; else
            git commit -m 'Audit Fr11 HI profile source assets'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
