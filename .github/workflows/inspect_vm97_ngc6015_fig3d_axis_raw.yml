name: Inspect VM97 NGC6015 Figure 3d axis source

on:
  push:
    paths:
      - 'scripts/stationary/inspect_vm97_ngc6015_fig3d_axis_raw.py'
      - '.github/workflows/inspect_vm97_ngc6015_fig3d_axis_raw.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect targeted Figure-3d axis source
        run: python scripts/stationary/inspect_vm97_ngc6015_fig3d_axis_raw.py
      - name: Commit compact audit race-safe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/vm97_ngc6015_fig3d_axis_raw_v1.json validation/stationary/vm97_ngc6015_fig3d_axis_raw_v1.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Inspect VM97 NGC6015 Figure 3d native axis source'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python scripts/stationary/inspect_vm97_ngc6015_fig3d_axis_raw.py
            git add validation/stationary/vm97_ngc6015_fig3d_axis_raw_v1.json validation/stationary/vm97_ngc6015_fig3d_axis_raw_v1.txt
            git commit -m 'Inspect VM97 NGC6015 Figure 3d native axis source' || true
            sleep 2
          done
          exit 1
