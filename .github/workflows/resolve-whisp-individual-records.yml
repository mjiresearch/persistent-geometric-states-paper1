name: Resolve WHISP individual galaxy records

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/resolve-whisp-individual-records.yml'

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Crawl WHISP catalog and individual records
        run: |
          python - <<'PY'
          import csv,re,urllib.parse,urllib.request
          from html.parser import HTMLParser
          from pathlib import Path

          BASE='https://www.astro.rug.nl/~whisp/Database/'
          CAND=['NGC3726','NGC3769','NGC3877','NGC3893','NGC3917','NGC3949','NGC3953','NGC3972','NGC3992','NGC4010','NGC4013','NGC4051','NGC4085','NGC4088','NGC4100','NGC4157','NGC4183','NGC4217','UGC06446','UGC06667','UGC06917','UGC06923','UGC06930','UGC06983','UGC07089']
          aliases={g:{g,g.replace('NGC0','NGC'),g.replace('UGC0','UGC')} for g in CAND}
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=='a':
                      d=dict(attrs); h=d.get('href');
                      if h: self.links.append(h)
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 persistence-research/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r: return r.read().decode('latin1','ignore'),r.status,r.geturl()
          seeds=['database_top.html','Overview/overview.html','OverviewCatalog/overview_catalog.html','DatabaseStatus/database_status.html']
          q=[]; seen=set(); pages=[]
          for s in seeds:
              q.append(urllib.parse.urljoin(BASE,s))
          # bounded crawl within WHISP Database tree
          while q and len(seen)<350:
              u=q.pop(0)
              if u in seen or not u.startswith(BASE): continue
              seen.add(u)
              try: txt,status,final=get(u)
              except Exception as e:
                  pages.append((u,'ERR',str(e),'','')); continue
              norm=re.sub(r'\s+','',txt.upper())
              hits=[g for g,a in aliases.items() if any(x in norm for x in a)]
              pages.append((u,status,';'.join(hits),len(txt),final))
              p=P(); p.feed(txt)
              for h in p.links:
                  v=urllib.parse.urljoin(u,h).split('#')[0]
                  if v.startswith(BASE) and v not in seen and len(v)<400:
                      # favor html/text/candidate-looking paths, skip images
                      if re.search(r'\.(gif|jpg|jpeg|png|ps|pdf)$',v,re.I): continue
                      q.append(v)
          out=Path('/tmp/whisp_resolve'); out.mkdir(exist_ok=True)
          with open(out/'whisp_crawl_pages.csv','w',newline='') as f:
              w=csv.writer(f); w.writerow(['url','status','candidate_hits','html_chars','final_url']);w.writerows(pages)
          # record every href on pages that contain candidates, including non-html products
          prod=[]
          for u,status,hits,_,_ in pages:
              if not hits or status=='ERR': continue
              try: txt,_,_=get(u)
              except: continue
              p=P();p.feed(txt)
              for h in p.links:
                  v=urllib.parse.urljoin(u,h)
                  prod.append((hits,u,h,v))
          with open(out/'whisp_candidate_links.csv','w',newline='') as f:
              w=csv.writer(f);w.writerow(['candidate_hits','source_page','href','resolved_url']);w.writerows(prod)
          print('pages crawled',len(pages),'candidate pages',sum(bool(r[2]) and r[1]!='ERR' for r in pages),'links',len(prod))
          for r in pages:
              if r[2] and r[1]!='ERR': print(r[:4])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: whisp-individual-record-resolution
          path: /tmp/whisp_resolve
