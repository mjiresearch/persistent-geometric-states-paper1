name: Ingest Iorio 2017 hidden-alias HI profiles

on:
  push:
    branches: [main]
    paths:
      - "scripts/stationary/ingest_iorio2017_alias_hi_profiles.py"
      - ".github/workflows/ingest_iorio2017_alias_hi.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and validate hidden-alias profiles
        run: |
          python scripts/stationary/ingest_iorio2017_alias_hi_profiles.py

      - name: Show acquisition summary
        run: |
          cat validation/stationary/iorio2017_alias_hi_profiles_v1_summary.json
          wc -l data/stationary/source_reconstruction/iorio2017_alias_hi_profiles_v1.csv

      - name: Commit selective source products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/stationary/source_reconstruction/iorio2017_alias_hi_profiles_v1.csv \
            validation/stationary/iorio2017_alias_hi_profiles_v1_summary.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Ingest public Iorio hidden-alias HI profiles"
            git push origin HEAD:main
          fi
