name: Audit Swaters recovered figure blocks

on:
  push:
    branches: [main]
    paths:
      - 'scripts/stationary/audit_sw02_recovered_figure_blocks.py'
      - 'data/stationary/source_reconstruction/sw02_recovered_atlas_page_map_v1.csv'
      - '.github/workflows/audit_sw02_recovered_figure_blocks.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit exact embedded figure blocks
        run: python scripts/stationary/audit_sw02_recovered_figure_blocks.py
      - name: Commit recoverability audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/sw02_recovered_figure_block_audit_v1.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Audit Swaters recovered figure blocks'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
