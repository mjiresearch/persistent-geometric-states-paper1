name: Promote FEASTS 2025 NGC2903 v1
on:
  push:
    paths:
      - 'scripts/stationary/promote_feasts2025_ngc2903_v1.py'
      - '.github/workflows/promote_feasts2025_ngc2903_v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stationary/promote_feasts2025_ngc2903_v1.py
      - run: python scripts/stationary/reconcile_public_hi_source_overlay_v1.py
      - run: python scripts/stationary/build_lelli_hi_profile_request_manifest.py
      - name: Commit promotion and reconciled counts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stationary/source_reconstruction/stationary_public_hi_source_overlay_v1.csv data/stationary/source_reconstruction/stationary_hi_profile_provenance_reconciled_v1.csv validation/stationary/stationary_hi_profile_provenance_reconciled_v1_summary.json data/stationary/source_reconstruction/lelli_hi_profile_request_manifest_v1.csv validation/stationary/lelli_hi_profile_request_manifest_v1_summary.json validation/stationary/CHECKPOINT_FEASTS2025_NGC2903_PROMOTION_V1.md
          git commit -m 'Promote FEASTS 2025 NGC2903 H I profile v1'
          for attempt in 1 2 3; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep 2; done
          exit 1
