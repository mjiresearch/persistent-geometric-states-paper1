name: Finalize THINGS DDO154 validation v3
on:
  push:
    paths:
      - 'scripts/stationary/finalize_things_ddo154_validation_v3.py'
      - '.github/workflows/finalize_things_ddo154_validation_v3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stationary/finalize_things_ddo154_validation_v3.py
      - name: Commit final validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/things_ddo154_mom0_validation_v3.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finalize DDO154 THINGS five-gate validation v3'
          git pull --rebase origin main
          git push origin HEAD:main
