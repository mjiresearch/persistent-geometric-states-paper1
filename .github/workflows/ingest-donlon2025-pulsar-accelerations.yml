name: Ingest Donlon 2025 Pulsar Accelerations

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ingest_donlon2025_pulsar_accelerations.py'
      - '.github/workflows/ingest-donlon2025-pulsar-accelerations.yml'

permissions:
  contents: write

concurrency:
  group: ingest-donlon2025-pulsar-accelerations
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas requests
      - name: Ingest catalog
        shell: bash
        run: |
          mkdir -p data/external/galactic_acceleration/donlon2025_v3
          set +e
          python scripts/ingest_donlon2025_pulsar_accelerations.py > data/external/galactic_acceleration/donlon2025_v3/run_output.txt 2>&1
          code=$?
          echo $code > data/external/galactic_acceleration/donlon2025_v3/exit_code.txt
          cat data/external/galactic_acceleration/donlon2025_v3/run_output.txt
          exit 0
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/external/galactic_acceleration/donlon2025_v3
          git diff --cached --quiet || git commit -m 'Ingest Donlon 2025 expanded pulsar accelerations'
          git pull --rebase origin main
          git push
