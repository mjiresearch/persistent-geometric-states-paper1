name: Map Swaters recovered atlas pages

on:
  push:
    branches: [main]
    paths:
      - 'scripts/stationary/map_sw02_recovered_atlas_pages.py'
      - 'data/stationary/source_reconstruction/sparc_hi_reference_family_priority_v1.csv'
      - 'validation/stationary/stationary_split_v1.csv'
      - '.github/workflows/map_sw02_recovered_atlas_pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build deterministic Swaters atlas page map
        run: python scripts/stationary/map_sw02_recovered_atlas_pages.py
      - name: Commit page map
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stationary/source_reconstruction/sw02_recovered_atlas_page_map_v1.csv validation/stationary/sw02_recovered_atlas_page_map_v1_summary.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Map Swaters recovered atlas pages'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
