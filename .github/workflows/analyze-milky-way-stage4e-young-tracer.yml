name: Analyze Milky Way Stage 4E Young Tracer

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze_milky_way_stage4e_young_tracer_history.py'
      - '.github/workflows/analyze-milky-way-stage4e-young-tracer.yml'
      - 'data/external/sdss/bossnet_hot_stars/bossnet_hot_stars_selected.csv.gz'
      - 'data/persistence_history/milky_way_stage4d_mwm_rbirth_spatial/mwm_rbirth_spatial_cells.csv'

permissions:
  contents: write

jobs:
  stage4e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas scipy scikit-learn astropy
      - name: Run Stage 4E
        shell: bash
        run: |
          mkdir -p data/persistence_history/milky_way_stage4e_young_tracer
          set +e
          python scripts/analyze_milky_way_stage4e_young_tracer_history.py > data/persistence_history/milky_way_stage4e_young_tracer/run_output.txt 2>&1
          code=$?
          echo $code > data/persistence_history/milky_way_stage4e_young_tracer/exit_code.txt
          cat data/persistence_history/milky_way_stage4e_young_tracer/run_output.txt
          exit 0
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/persistence_history/milky_way_stage4e_young_tracer
          git diff --cached --quiet || git commit -m 'Add Milky Way Stage 4E young-tracer results'
          git pull --rebase origin main
          git push
