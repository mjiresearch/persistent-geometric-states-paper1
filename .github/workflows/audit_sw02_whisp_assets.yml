name: Audit Swaters 2002 WHISP public assets

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/audit_sw02_whisp_assets.yml
      - scripts/stationary/audit_sw02_whisp_assets.py

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit arXiv source assets
        run: python scripts/stationary/audit_sw02_whisp_assets.py
      - name: Commit audit product
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/stationary/sw02_whisp_public_asset_audit_v1.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Audit Swaters 2002 WHISP public profile assets"
            git pull --rebase origin main
            git push
          fi
