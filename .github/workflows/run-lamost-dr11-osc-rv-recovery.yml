name: Run frozen LAMOST DR11 OSC RV recovery
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/recover_lamost_dr11_osc_rv.py'
      - 'data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/LAMOST_DR11_OSC_RV_RECOVERY_FREEZE.md'
      - '.github/workflows/run-lamost-dr11-osc-rv-recovery.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas astropy astroquery requests
      - name: Recover outcome-blind LAMOST DR11 RVs
        run: python data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/recover_lamost_dr11_osc_rv.py
      - name: Commit immutable recovery products
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/osc_rv_target_rank/lamost_dr11_recovery
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze LAMOST DR11 OSC RV recovery outputs'
            git pull --rebase origin main
            git push
          fi
