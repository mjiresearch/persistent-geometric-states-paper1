name: Ingest BOSSNet Hot Stars

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ingest_bossnet_hot_stars.py'
      - '.github/workflows/ingest-bossnet-hot-stars.yml'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests numpy pandas astropy
      - name: Ingest hot-star sample
        shell: bash
        run: |
          mkdir -p data/external/sdss/bossnet_hot_stars
          set +e
          python scripts/ingest_bossnet_hot_stars.py > data/external/sdss/bossnet_hot_stars/run_output.txt 2>&1
          code=$?
          echo $code > data/external/sdss/bossnet_hot_stars/exit_code.txt
          cat data/external/sdss/bossnet_hot_stars/run_output.txt
          exit 0
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/external/sdss/bossnet_hot_stars
          git diff --cached --quiet || git commit -m 'Ingest BOSSNet hot-star sample'
          git pull --rebase origin main
          git push
