name: Audit Rh96 NGC100 public profile route

on:
  push:
    paths:
      - 'scripts/stationary/audit_rh96_ngc0100_public_profile_route.py'
      - '.github/workflows/audit_rh96_ngc0100_public_profile_route.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit CDS/VizieR Rh96 NGC100 exact profile assets
        run: python scripts/stationary/audit_rh96_ngc0100_public_profile_route.py
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/rh96_ngc0100_public_profile_route_v1.json validation/stationary/rh96_ngc0100_public_profile_route_v1.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit Rh96 NGC100 public H I profile route'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
