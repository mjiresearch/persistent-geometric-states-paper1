name: Audit Tr09 exact HI profile routes
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/stationary/audit_tr09_hi_profile_routes.py'
      - '.github/workflows/audit_tr09_hi_profile_routes.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stationary/audit_tr09_hi_profile_routes.py
      - name: Commit Tr09 audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/tr09_hi_profile_route_audit_v1.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Audit Tr09 exact HI profile routes'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
