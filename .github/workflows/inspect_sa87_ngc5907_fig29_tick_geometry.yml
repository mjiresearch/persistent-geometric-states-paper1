name: Inspect SA87 NGC5907 Figure 29 tick geometry

on:
  push:
    paths:
      - 'scripts/stationary/inspect_sa87_ngc5907_fig29_tick_geometry.py'
      - '.github/workflows/inspect_sa87_ngc5907_fig29_tick_geometry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pymupdf
      - name: Inspect native tick geometry
        run: python scripts/stationary/inspect_sa87_ngc5907_fig29_tick_geometry.py
      - name: Commit tick geometry race-safe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/sa87_ngc5907_fig29_tick_geometry_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Inspect NGC5907 Figure 29 native tick geometry'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python scripts/stationary/inspect_sa87_ngc5907_fig29_tick_geometry.py
            git add validation/stationary/sa87_ngc5907_fig29_tick_geometry_v1.json
            git commit -m 'Inspect NGC5907 Figure 29 native tick geometry' || true
            sleep 2
          done
          exit 1
