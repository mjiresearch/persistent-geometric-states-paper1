name: Audit de Blok 1996 public H I assets

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/audit_db96_hi_assets.yml
      - scripts/stationary/audit_db96_hi_assets.py

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit dB96 source package
        run: python scripts/stationary/audit_db96_hi_assets.py
      - name: Commit asset audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/stationary/db96_hi_public_asset_audit_v1.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Audit de Blok 1996 H I source assets"
            git pull --rebase origin main
            git push
          fi
