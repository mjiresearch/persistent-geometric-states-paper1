name: Close Tr09 and rerank stationary HI queue
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/stationary/close_tr09_no_exact_profile.py'
      - '.github/workflows/close_tr09_and_rerank.yml'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Close Tr09 from committed source audit
        run: python scripts/stationary/close_tr09_no_exact_profile.py
      - name: Rerank remaining Lelli SPARC families
        run: python scripts/stationary/rank_sparc_hi_reference_families.py
      - name: Append live resume point
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('validation/stationary/sparc_hi_reference_family_priority_v1_summary.json')
          s=json.loads(p.read_text()); top=s.get('top_15_actionable_reference_families',[]); first=top[0] if top else None
          q=Path('validation/stationary/CHECKPOINT_AFTER_TR09_DISPOSITION.md'); t=q.read_text();t+='\n## Reranked live queue\n'
          if first:
              t+=f"Next actionable family: **{first['sparc_ref_id']}** — {first['n_untouched_frozen_galaxies']} untouched frozen galaxies ({first['n_calibration']} calibration, {first['n_blind']} blind). Galaxies: {first['galaxies']}.\n"
          else:t+='No actionable family remains.\n'
          t+=f"\nUntouched frozen galaxies remaining: {s.get('n_untouched_no_public_overlay')}.\nPriority summary: `validation/stationary/sparc_hi_reference_family_priority_v1_summary.json`\n"
          q.write_text(t);print(json.dumps({'next':first,'untouched':s.get('n_untouched_no_public_overlay'),'actionable':s.get('n_actionable_reference_families')},indent=2))
          PY
      - name: Commit disposition and rerank checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stationary/source_reconstruction/sparc_hi_reference_family_disposition_v1.csv data/stationary/source_reconstruction/sparc_hi_reference_family_priority_v1.csv validation/stationary/sparc_hi_reference_family_priority_v1_summary.json validation/stationary/CHECKPOINT_AFTER_TR09_DISPOSITION.md
          if git diff --cached --quiet; then echo 'No generated changes'; else
            git commit -m 'Close Tr09 exact-profile route and advance queue'
            for attempt in 1 2 3; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep 2; done
            exit 1
          fi
