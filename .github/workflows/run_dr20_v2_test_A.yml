name: DR20 v2 Test A asymmetric drift

on:
  push:
    branches:
      - agent/dr20-young-old-current-field-v1
    paths:
      - '.github/workflows/run_dr20_v2_test_A.yml'
      - 'scripts/analyze_dr20_asymmetric_drift_v2.py'
      - 'docs/dr20_v2_test_A_implementation_lock.md'
      - 'data/persistence_history/dr20_independent/protocol_v1.json'
      - 'data/persistence_history/dr20_independent/protocol_v2_conventional_challenge.json'
      - 'data/persistence_history/dr20_independent/field_v1/field_star_sample.csv.gz'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen DR20 branch
        uses: actions/checkout@v4
        with:
          ref: agent/dr20-young-old-current-field-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas

      - name: Run frozen Test A
        run: python scripts/analyze_dr20_asymmetric_drift_v2.py

      - name: Commit Test A products
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/persistence_history/dr20_independent/conventional_challenge_v2/test_A_asymmetric_drift
          if git diff --cached --quiet; then
            echo 'No Test A product changes to commit.'
          else
            git commit -m 'Record frozen DR20 v2 Test A results'
            git push origin HEAD:agent/dr20-young-old-current-field-v1
          fi
