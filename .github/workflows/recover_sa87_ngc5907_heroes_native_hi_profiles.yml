name: Recover SA87 NGC5907 HEROES native HI profiles

on:
  push:
    paths:
      - 'scripts/stationary/recover_sa87_ngc5907_heroes_native_hi_profiles.py'
      - '.github/workflows/recover_sa87_ngc5907_heroes_native_hi_profiles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet pymupdf numpy
      - name: Recover source-native NGC5907 HI profiles
        run: python scripts/stationary/recover_sa87_ngc5907_heroes_native_hi_profiles.py
      - name: Commit recovery products race-safe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stationary/source_reconstruction/sa87_ngc5907_heroes2015_hi_side_profiles_v1.csv \
                  data/stationary/source_reconstruction/sa87_ngc5907_heroes2015_hi_m0_mean_v1.csv \
                  validation/stationary/sa87_ngc5907_heroes2015_native_hi_recovery_v1.json \
                  validation/stationary/sa87_ngc5907_heroes2015_source_convention_v1.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Recover SA87 NGC5907 native-vector HI profiles'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python scripts/stationary/recover_sa87_ngc5907_heroes_native_hi_profiles.py
            git add data/stationary/source_reconstruction/sa87_ngc5907_heroes2015_hi_side_profiles_v1.csv data/stationary/source_reconstruction/sa87_ngc5907_heroes2015_hi_m0_mean_v1.csv validation/stationary/sa87_ngc5907_heroes2015_native_hi_recovery_v1.json validation/stationary/sa87_ngc5907_heroes2015_source_convention_v1.txt
            git commit -m 'Recover SA87 NGC5907 native-vector HI profiles' || true
            sleep 2
          done
          exit 1
