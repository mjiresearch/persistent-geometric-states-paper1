name: Audit Zakharova 2023 THINGS profile assets
on:
  push:
    paths:
      - 'scripts/stationary/audit_zakharova2023_things_profile_assets.py'
      - '.github/workflows/audit_zakharova2023_things_profile_assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stationary/audit_zakharova2023_things_profile_assets.py
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/zakharova2023_things_profile_asset_audit_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit Zakharova 2023 THINGS profile assets'
          git pull --rebase origin main
          git push origin HEAD:main
