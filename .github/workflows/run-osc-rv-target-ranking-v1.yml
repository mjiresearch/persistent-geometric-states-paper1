name: Run OSC RV target ranking v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/rank_missing_osc_systemic_rvs_v1.py'
      - 'data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/OSC_RV_TARGET_RANKING_FREEZE_V1.md'
      - '.github/workflows/run-osc-rv-target-ranking-v1.yml'
permissions:
  contents: write
jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas astropy scipy requests
      - name: Rank missing OSC systemic-RV measurements
        run: python data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/rank_missing_osc_systemic_rvs_v1.py
      - name: Commit frozen ranking products
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/osc_rv_target_ranking_v1
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze outcome-blind OSC systemic-RV target ranking V1'
            git pull --rebase origin main
            git push
          fi
