name: Reduce HIX2018 NGC289 HI panel geometry

on:
  push:
    paths:
      - 'scripts/stationary/reduce_hix2018_ngc289_hi_panel_geometry.py'
      - '.github/workflows/reduce_hix2018_ngc289_hi_panel_geometry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pymupdf
      - name: Reduce native H I panel geometry
        run: python scripts/stationary/reduce_hix2018_ngc289_hi_panel_geometry.py
      - name: Commit compact reduction race-safe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/hix2018_ngc289_hi_panel_geometry_v1.json validation/stationary/hix2018_ngc289_hi_panel_geometry_v1.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Reduce HIX2018 NGC289 native HI panel geometry'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python scripts/stationary/reduce_hix2018_ngc289_hi_panel_geometry.py
            git add validation/stationary/hix2018_ngc289_hi_panel_geometry_v1.json validation/stationary/hix2018_ngc289_hi_panel_geometry_v1.txt
            git commit -m 'Reduce HIX2018 NGC289 native HI panel geometry' || true
            sleep 2
          done
          exit 1
