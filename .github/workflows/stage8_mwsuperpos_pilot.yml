name: Stage 8 mwsuperpos pilot

on:
  push:
    branches:
      - agent/add-mwsuperpos-persistence-controls
    paths:
      - '.github/workflows/stage8_mwsuperpos_pilot.yml'
      - 'scripts/milky_way/mwsuperpos/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/stage8_mwsuperpos_pilot.yml'
      - 'scripts/milky_way/mwsuperpos/**'
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: 4
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgsl-dev libeigen3-dev wget

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies and AGAMA
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install numpy scipy astropy
          python -m pip install agama --no-build-isolation --config-settings="--build-option=--yes"

      - name: Download public APOGEE DR17 inputs
        run: |
          mkdir -p stage8_inputs
          wget -q --show-progress -O stage8_inputs/allStar-dr17-synspec_rev1.fits \
            https://data.sdss.org/sas/dr17/apogee/spectro/aspcap/dr17/synspec_rev1/allStar-dr17-synspec_rev1.fits
          wget -q --show-progress -O stage8_inputs/APOGEE_DistMass-DR17_v1.6.1.fits \
            https://data.sdss.org/sas/dr17/apogee/vac/apogee-distmass/APOGEE_DistMass-DR17_v1.6.1.fits
          sha256sum stage8_inputs/*.fits | tee stage8_inputs/sha256sums.txt

      - name: Run four-potential pilot
        working-directory: scripts/milky_way/mwsuperpos
        shell: bash
        run: |
          set -o pipefail
          python compare_potentials.py \
            --allstar ../../../stage8_inputs/allStar-dr17-synspec_rev1.fits \
            --distmass ../../../stage8_inputs/APOGEE_DistMass-DR17_v1.6.1.fits \
            --outdir ../../../stage8_pilot_results \
            --target-density portail17 \
            --limit 2500 \
            --nreal 5 \
            --nsub 5 \
            2>&1 | tee ../../../stage8_pilot_results.log

      - name: Summarize pilot outputs
        if: always()
        run: |
          echo '--- comparison summary ---'
          test -f stage8_pilot_results/comparison_summary.csv && cat stage8_pilot_results/comparison_summary.csv || true
          echo '--- output files ---'
          find stage8_pilot_results -maxdepth 2 -type f -printf '%p %s bytes\n' 2>/dev/null | sort || true

      - name: Upload pilot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage8-mwsuperpos-pilot
          path: |
            stage8_pilot_results/
            stage8_pilot_results.log
            stage8_inputs/sha256sums.txt
          if-no-files-found: warn
          retention-days: 14
