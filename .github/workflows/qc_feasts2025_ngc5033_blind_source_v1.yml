name: QC FEASTS 2025 NGC5033 blind source v1
on:
  push:
    paths:
      - 'scripts/stationary/qc_feasts2025_ngc5033_blind_source_v1.py'
      - 'validation/stationary/FEASTS2025_BLIND_HI_SOURCE_ACQUISITION_PROTOCOL_V1.md'
      - '.github/workflows/qc_feasts2025_ngc5033_blind_source_v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy astropy
      - run: python scripts/stationary/qc_feasts2025_ngc5033_blind_source_v1.py
      - name: Commit blind source-only QC
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stationary/source_reconstruction/feasts2025_ngc5033_hi_profile_raw_v1.csv validation/stationary/feasts2025_ngc5033_blind_source_qc_v1.json
          git commit -m 'QC FEASTS 2025 NGC5033 blind H I source v1'
          git pull --rebase origin main
          git push origin HEAD:main
