name: Validate HI interpolation rule v1

on:
  push:
    paths:
      - 'scripts/stationary/validate_hi_interpolation_rule_v1.py'
      - '.github/workflows/validate_hi_interpolation_rule_v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stationary/validate_hi_interpolation_rule_v1.py
      - name: Commit validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/hi_interpolation_rule_v1_mock_validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Validate HI interpolation rule v1'
          git pull --rebase origin main
          git push origin HEAD:main
