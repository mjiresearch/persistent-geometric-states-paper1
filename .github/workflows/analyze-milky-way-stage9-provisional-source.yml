name: Analyze Milky Way Stage 9 Provisional Source Suite

on:
  workflow_dispatch:
  push:
    paths:
      - 'analysis/milky_way/orientation_history.py'
      - 'analysis/milky_way/provisional_source_history.py'
      - 'analysis/milky_way/persistence_response.py'
      - 'analysis/milky_way/characteristic_speed_gate.py'
      - 'analysis/milky_way/candidate_l0.py'
      - 'analysis/milky_way/candidate_l1.py'
      - 'analysis/milky_way/candidate_l2.py'
      - 'analysis/milky_way/candidate_a0.py'
      - 'analysis/milky_way/candidate_a0_advected_state.py'
      - 'analysis/milky_way/candidate_a1_metric_coupling.py'
      - 'analysis/milky_way/historical_baryonic_potential.py'
      - 'docs/theory/stage9_candidate_L0_minimal_causal_response.md'
      - 'docs/theory/stage9_characteristic_speed_audit.md'
      - 'docs/theory/stage9_advected_state_route.md'
      - 'docs/theory/stage9_candidate_A0_covariant_advected_state.md'
      - 'docs/theory/stage9_a1_observable_metric_coupling.md'
      - 'scripts/build_milky_way_stage9_orientation_suite.py'
      - 'scripts/build_milky_way_stage9_provisional_source_suite.py'
      - 'scripts/build_milky_way_stage9a_historical_potential.py'
      - 'scripts/build_milky_way_stage9a_candidate_l2_field.py'
      - 'scripts/compare_milky_way_stage9a_l2_to_rotation_residual.py'
      - 'tests/test_orientation_history.py'
      - 'tests/test_provisional_source_history.py'
      - 'tests/test_persistence_response.py'
      - 'tests/test_characteristic_speed_gate.py'
      - 'tests/test_candidate_l0.py'
      - 'tests/test_candidate_l1.py'
      - 'tests/test_candidate_l2.py'
      - 'tests/test_candidate_a0.py'
      - 'tests/test_candidate_a1_metric_coupling.py'
      - 'tests/test_historical_baryonic_potential.py'
      - '.github/workflows/analyze-milky-way-stage9-provisional-source.yml'

permissions:
  contents: write

concurrency:
  group: milky-way-stage9-provisional-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage9-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy pytest
      - name: Run Stage 9 source and theory tests
        run: >-
          python -m pytest -q
          tests/test_orientation_history.py
          tests/test_provisional_source_history.py
          tests/test_persistence_response.py
          tests/test_characteristic_speed_gate.py
          tests/test_candidate_l0.py
          tests/test_candidate_l1.py
          tests/test_candidate_l2.py
          tests/test_candidate_a0.py
          tests/test_candidate_a1_metric_coupling.py
          tests/test_historical_baryonic_potential.py
      - name: Freeze orientation suite
        run: python scripts/build_milky_way_stage9_orientation_suite.py
      - name: Build provisional hereditary source suite
        shell: bash
        run: |
          mkdir -p data/persistence_history/milky_way_stage9_provisional_source_suite
          python scripts/build_milky_way_stage9_provisional_source_suite.py \
            > data/persistence_history/milky_way_stage9_provisional_source_suite/run_output.txt 2>&1
          cat data/persistence_history/milky_way_stage9_provisional_source_suite/run_output.txt
      - name: Build Stage 9A historical baryonic potential
        shell: bash
        run: |
          mkdir -p data/persistence_history/milky_way_stage9a_historical_potential
          python scripts/build_milky_way_stage9a_historical_potential.py \
            > data/persistence_history/milky_way_stage9a_historical_potential/run_output.txt 2>&1
          cat data/persistence_history/milky_way_stage9a_historical_potential/run_output.txt
      - name: Build Stage 9A Candidate L2 field
        shell: bash
        run: |
          mkdir -p data/persistence_history/milky_way_stage9a_candidate_l2
          python scripts/build_milky_way_stage9a_candidate_l2_field.py \
            > data/persistence_history/milky_way_stage9a_candidate_l2/run_output.txt 2>&1
          cat data/persistence_history/milky_way_stage9a_candidate_l2/run_output.txt
      - name: Compare frozen L2 field to Stage 3 residual
        shell: bash
        run: |
          python scripts/compare_milky_way_stage9a_l2_to_rotation_residual.py \
            > data/persistence_history/milky_way_stage9a_candidate_l2/comparison_output.txt 2>&1
          cat data/persistence_history/milky_way_stage9a_candidate_l2/comparison_output.txt
      - name: Commit generated source-side products
        if: github.ref_type == 'branch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/persistence_history/milky_way_stage9_orientation_suite \
                  data/persistence_history/milky_way_stage9_provisional_source_suite \
                  data/persistence_history/milky_way_stage9a_historical_potential \
                  data/persistence_history/milky_way_stage9a_candidate_l2
          git diff --cached --quiet || git commit -m 'Add Milky Way Stage 9A corrected L2 comparison results'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
