name: Inspect HIX2018 NGC289 app-fig3 PDF

on:
  push:
    paths:
      - 'scripts/stationary/inspect_hix2018_ngc289_app_fig3_pdf.py'
      - '.github/workflows/inspect_hix2018_ngc289_app_fig3_pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pymupdf
      - name: Inspect NGC289 appendix PDF structure
        run: python scripts/stationary/inspect_hix2018_ngc289_app_fig3_pdf.py
      - name: Commit structure audit race-safe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/hix2018_ngc289_app_fig3_native_structure_v1.json validation/stationary/hix2018_ngc289_app_fig3_native_structure_v1.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Inspect HIX2018 NGC289 app-fig3 native structure'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python scripts/stationary/inspect_hix2018_ngc289_app_fig3_pdf.py
            git add validation/stationary/hix2018_ngc289_app_fig3_native_structure_v1.json validation/stationary/hix2018_ngc289_app_fig3_native_structure_v1.txt
            git commit -m 'Inspect HIX2018 NGC289 app-fig3 native structure' || true
            sleep 2
          done
          exit 1
