name: Promote Ch06 NGC24 H I profile
on:
  push:
    paths:
      - 'scripts/stationary/integrate_ch06_ngc0024_profile.py'
      - '.github/workflows/audit_ca90_ngc0247_bibliography_and_hi_profile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Promote and rerank
        run: |
          python scripts/stationary/integrate_ch06_ngc0024_profile.py
          python scripts/stationary/reconcile_public_hi_source_overlay_v1.py
          python scripts/stationary/rank_sparc_hi_reference_families.py
          python scripts/stationary/update_project_ledger_hi_checkpoint.py
      - name: Commit generated state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stationary/source_reconstruction/stationary_public_hi_source_overlay_v1.csv data/stationary/source_reconstruction/sparc_hi_reference_family_disposition_v1.csv data/stationary/source_reconstruction/stationary_hi_profile_provenance_reconciled_v1.csv data/stationary/source_reconstruction/sparc_hi_reference_family_priority_v1.csv validation/stationary/stationary_hi_profile_provenance_reconciled_v1_summary.json validation/stationary/sparc_hi_reference_family_priority_v1_summary.json validation/stationary/CHECKPOINT_AFTER_CH06_NGC0024_PROMOTION.md PROJECT_LEDGER.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Promote Ch06 NGC24 H I profile and rerank'
          git pull --rebase origin main
          git push origin HEAD:main
