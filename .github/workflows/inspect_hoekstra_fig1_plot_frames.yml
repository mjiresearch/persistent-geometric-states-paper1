name: Inspect Hoekstra Fig1 plot frames

on:
  push:
    branches: [main]
    paths:
      - 'scripts/stationary/inspect_hoekstra_fig1_plot_frames.py'
      - '.github/workflows/inspect_hoekstra_fig1_plot_frames.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf
      - name: Inspect vector panel frames
        run: python scripts/stationary/inspect_hoekstra_fig1_plot_frames.py
      - name: Commit frame audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/hoekstra2001_fig1_plot_frames_v1.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Inspect Hoekstra Fig1 plot frames'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
