name: Extract Ha14 density Z markers
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/stationary/extract_ha14_density_z_markers.py'
      - '.github/workflows/extract_ha14_density_z_markers.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stationary/extract_ha14_density_z_markers.py
      - name: Commit extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/ha14_density_z_markers_v1.json
          if git diff --cached --quiet; then echo 'No changes'; else
            git commit -m 'Extract Ha14 density Z markers'
            for attempt in 1 2 3; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep 2; done
            exit 1
          fi
