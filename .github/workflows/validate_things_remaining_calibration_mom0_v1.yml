name: Validate remaining THINGS calibration MOM0 v1
on:
  push:
    paths:
      - 'scripts/stationary/validate_things_remaining_calibration_mom0_v1.py'
      - '.github/workflows/validate_things_remaining_calibration_mom0_v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy astropy
      - name: Run remaining calibration validation
        run: python scripts/stationary/validate_things_remaining_calibration_mom0_v1.py
      - name: Commit validation diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stationary/source_reconstruction/things_ngc2841_mom0_reconstructed_raw_hi_v1.csv data/stationary/source_reconstruction/things_ngc3198_mom0_reconstructed_raw_hi_v1.csv validation/stationary/things_ngc2841_mom0_validation_v1.json validation/stationary/things_ngc3198_mom0_validation_v1.json validation/stationary/things_remaining_calibration_mom0_validation_v1_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Validate remaining THINGS calibration MOM0 profiles v1'
          git pull --rebase origin main
          git push origin HEAD:main
