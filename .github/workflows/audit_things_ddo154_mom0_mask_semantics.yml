name: Audit DDO154 THINGS MOM0 mask semantics
on:
  push:
    paths:
      - 'scripts/stationary/audit_things_ddo154_mom0_mask_semantics.py'
      - '.github/workflows/audit_things_ddo154_mom0_mask_semantics.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy astropy
      - run: python scripts/stationary/audit_things_ddo154_mom0_mask_semantics.py
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/things_ddo154_mom0_mask_semantics_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit DDO154 THINGS MOM0 mask semantics'
          git pull --rebase origin main
          git push origin HEAD:main
