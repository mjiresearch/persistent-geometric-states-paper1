name: Run frozen GALAH DR4 OSC RV recovery
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/recover_galah_dr4_osc_rv.py'
      - 'data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/GALAH_DR4_OSC_RV_RECOVERY_FREEZE.md'
      - '.github/workflows/run-galah-dr4-osc-rv-recovery.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pandas astropy astroquery
      - run: python data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/recover_galah_dr4_osc_rv.py
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/osc_rv_target_rank/galah_dr4_recovery
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze GALAH DR4 OSC RV recovery outputs'
            git pull --rebase origin main
            git push
          fi
