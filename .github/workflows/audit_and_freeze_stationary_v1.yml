name: Audit and freeze stationary observational v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/stationary/frozen/stationary_master_v1.csv'
      - 'validation/stationary/stationary_sample_manifest_v1.csv'
      - 'scripts/stationary/audit_stationary_metadata_v1.py'
      - '.github/workflows/audit_and_freeze_stationary_v1.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download authoritative SPARC catalog
        run: |
          curl -fL --retry 3 \
            https://astroweb.case.edu/SPARC/SPARC_Lelli2016c.mrt \
            -o /tmp/SPARC_Lelli2016c.mrt

      - name: Audit metadata and write freeze record
        run: |
          python scripts/stationary/audit_stationary_metadata_v1.py \
            --manifest validation/stationary/stationary_sample_manifest_v1.csv \
            --master data/stationary/frozen/stationary_master_v1.csv \
            --catalog /tmp/SPARC_Lelli2016c.mrt \
            --audit-csv validation/stationary/stationary_metadata_audit_v1.csv \
            --audit-json validation/stationary/stationary_metadata_audit_v1.json \
            --report-md validation/stationary/stationary_metadata_audit_v1.md \
            --freeze-md data/stationary/frozen/STATIONARY_OBSERVATIONAL_FREEZE_V1.md

      - name: Commit audit products and freeze record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/stationary_metadata_audit_v1.csv
          git add validation/stationary/stationary_metadata_audit_v1.json
          git add validation/stationary/stationary_metadata_audit_v1.md
          git add data/stationary/frozen/STATIONARY_OBSERVATIONAL_FREEZE_V1.md
          if git diff --cached --quiet; then
            echo 'No audit changes to commit.'
          else
            git commit -m 'Freeze stationary observational metadata v1'
            git push
          fi
