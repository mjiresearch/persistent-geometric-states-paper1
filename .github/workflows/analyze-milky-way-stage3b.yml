# Trigger Stage 3B after workflow installation.
name: Analyze Milky Way Stage 3B McGaugh Cross-check

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze_milky_way_stage3b_mcgaugh.py'
      - '.github/workflows/analyze-milky-way-stage3b.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy requests
      - name: Run Stage 3B
        id: run
        continue-on-error: true
        run: |
          mkdir -p data/persistence_history/milky_way_stage3b_mcgaugh
          set +e
          python scripts/analyze_milky_way_stage3b_mcgaugh.py > data/persistence_history/milky_way_stage3b_mcgaugh/run_output.txt 2>&1
          code=$?
          echo "$code" > data/persistence_history/milky_way_stage3b_mcgaugh/exit_code.txt
          cat data/persistence_history/milky_way_stage3b_mcgaugh/run_output.txt
          exit $code
      - name: Commit outputs
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/persistence_history/milky_way_stage3b_mcgaugh/run_output.txt
          git add data/persistence_history/milky_way_stage3b_mcgaugh
          if git diff --cached --quiet; then
            echo 'No Stage 3B changes to commit.'
          else
            git commit -m 'Add Milky Way Stage 3B McGaugh cross-check results'
            git push
          fi
      - name: Fail if analysis failed
        if: steps.run.outcome == 'failure'
        run: exit 1
