name: Fetch SDSS persistence data

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_sdss_persistence_data.py'
      - '.github/workflows/fetch-sdss-persistence-data.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 astropy pandas pyarrow

      - name: Fetch and normalize SDSS datasets
        run: python scripts/fetch_sdss_persistence_data.py

      - name: Show downloaded products
        run: |
          find data/external/sdss -maxdepth 3 -type f -printf '%p %s bytes\n' | sort

      - name: Commit downloaded data and provenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/external/sdss
          if git diff --cached --quiet; then
            echo 'No SDSS data changes to commit.'
          else
            git commit -m 'Ingest public SDSS persistence datasets'
            git push
          fi
