name: Extract CP90 Westmeier 2011 NGC300 profile
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/stationary/extract_cp90_westmeier2011_ngc300_profile.py'
      - '.github/workflows/extract_cp90_westmeier2011_ngc300_profile.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stationary/extract_cp90_westmeier2011_ngc300_profile.py
      - name: Commit NGC300 source-table profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stationary/source_reconstruction/westmeier2011_ngc300_gas_profile_v1.csv validation/stationary/cp90_westmeier2011_ngc300_profile_extraction_v1.json
          if git diff --cached --quiet; then echo 'No changes'; else
            git commit -m 'Extract Westmeier 2011 NGC300 gas profile'
            for attempt in 1 2 3; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep 2; done
            exit 1
          fi
