name: Match Hoekstra Fig1 digit templates

on:
  push:
    branches: [main]
    paths:
      - 'scripts/stationary/match_hoekstra_fig1_digit_templates.py'
      - '.github/workflows/match_hoekstra_fig1_digit_templates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf
      - name: Match panel-name digit glyphs
        run: python scripts/stationary/match_hoekstra_fig1_digit_templates.py
      - name: Commit digit-template QC
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/hoekstra2001_fig1_digit_template_match_v1.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Match Hoekstra Fig1 digit templates'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
