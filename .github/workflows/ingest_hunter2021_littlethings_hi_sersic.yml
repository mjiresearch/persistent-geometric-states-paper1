name: Ingest Hunter 2021 LITTLE THINGS HI Sersic parameters

on:
  push:
    branches: [main]
    paths:
      - 'scripts/stationary/ingest_hunter2021_littlethings_hi_sersic.py'
      - '.github/workflows/ingest_hunter2021_littlethings_hi_sersic.yml'
      - 'validation/stationary/stationary_split_v1.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and crossmatch public Hunter 2021 parameters
        run: python scripts/stationary/ingest_hunter2021_littlethings_hi_sersic.py
      - name: Show summary
        run: cat validation/stationary/hunter2021_littlethings_hi_sersic_parameters_v1_summary.json
      - name: Commit generated source products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/stationary/source_reconstruction/hunter2021_littlethings_hi_sersic_parameters_v1.csv \
            validation/stationary/hunter2021_littlethings_hi_sersic_parameters_v1_summary.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Ingest public Hunter 2021 LITTLE THINGS HI Sersic parameters"
            git push origin HEAD:main
          fi
