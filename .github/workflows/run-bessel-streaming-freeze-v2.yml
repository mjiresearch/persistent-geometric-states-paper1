name: Run BeSSeL streaming freeze v2

on:
  push:
    paths:
      - 'data/persistence_history/hi4pi_grb_geometric_distance/bessel_streaming_frozen/CONVENTIONAL_BESSEL_STREAMING_FREEZE_V2.md'
      - 'data/persistence_history/hi4pi_grb_geometric_distance/bessel_streaming_frozen/select_bessel_streaming_field_v2.py'
      - '.github/workflows/run-bessel-streaming-freeze-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas astropy
      - name: Select support-qualified field
        run: python data/persistence_history/hi4pi_grb_geometric_distance/bessel_streaming_frozen/select_bessel_streaming_field_v2.py
      - name: Commit V2 frozen products
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/persistence_history/hi4pi_grb_geometric_distance/bessel_streaming_frozen/outputs_v2
          git commit -m 'Freeze support-qualified BeSSeL streaming field v2 outputs' || exit 0
          git pull --rebase origin main
          git push
