name: Recover Swaters full atlas via Wayback

on:
  push:
    branches: [main]
    paths:
      - 'scripts/stationary/recover_sw02_full_atlas_wayback.py'
      - '.github/workflows/recover_sw02_full_atlas_wayback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recover exact historical atlas
        run: python scripts/stationary/recover_sw02_full_atlas_wayback.py
      - name: Commit recovery audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/sw02_full_atlas_wayback_recovery_v1.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Audit Swaters full-atlas archive recovery'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
