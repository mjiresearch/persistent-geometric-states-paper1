name: Audit Wevers 1986 PDF geometry

on:
  push:
    branches: [main]
    paths:
      - 'scripts/stationary/audit_wevers1986_pdf_geometry.py'
      - '.github/workflows/audit_wevers1986_pdf_geometry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet PyMuPDF
      - name: Classify recovered PDF geometry
        run: python scripts/stationary/audit_wevers1986_pdf_geometry.py
      - name: Commit geometry gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/wevers1986_pdf_geometry_v1.json
          if git diff --cached --quiet; then echo 'No changes'; else
            git commit -m 'Classify Wevers 1986 PDF geometry'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
