# Trigger Stage 1 history-signal analysis after workflow creation.
name: Analyze Milky Way Stage 1

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze_milky_way_stage1.py'
      - '.github/workflows/analyze-milky-way-stage1.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow scikit-learn

      - name: Run Milky Way Stage 1 analysis
        run: python scripts/analyze_milky_way_stage1.py

      - name: Show outputs
        run: |
          find data/persistence_history/milky_way_stage1 -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Commit analysis outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/persistence_history/milky_way_stage1
          if git diff --cached --quiet; then
            echo 'No Stage 1 output changes to commit.'
          else
            git commit -m 'Add Milky Way Stage 1 history analysis results'
            git push
          fi
