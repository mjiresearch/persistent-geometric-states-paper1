name: Audit Ha14 HI profile source assets
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/stationary/audit_ha14_hi_profile_source_assets.py'
      - '.github/workflows/audit_ha14_hi_profile_source_assets.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit Ha14 arXiv source package
        run: python scripts/stationary/audit_ha14_hi_profile_source_assets.py
      - name: Commit Ha14 audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/ha14_hi_profile_source_asset_audit_v1.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Audit Ha14 HI profile source assets'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
