name: Audit VS01 Ursa Major public assets

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/audit_vs01_ursa_major_assets.yml
      - scripts/stationary/audit_vs01_ursa_major_assets.py

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit public arXiv and A&A assets
        run: python scripts/stationary/audit_vs01_ursa_major_assets.py
      - name: Show compact findings
        run: |
          python - <<'PY'
          import json
          x=json.load(open('validation/stationary/vs01_ursa_major_public_asset_audit_v1.json'))
          print('arxiv files',x['arxiv']['n_files'])
          print('candidate assets',x['arxiv']['candidate_profile_assets'])
          print('text hit files',[v['file'] for v in x['arxiv']['text_hits']])
          print('A&A PS bytes',x['aanda_postscript']['postscript_bytes'])
          print('EPS/vector markers',x['aanda_postscript']['has_epsf_markers'],x['aanda_postscript']['has_color_commands'])
          PY
      - name: Commit audit product
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/stationary/vs01_ursa_major_public_asset_audit_v1.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Audit VS01 Ursa Major public profile assets"
            git pull --rebase origin main
            git push
          fi
