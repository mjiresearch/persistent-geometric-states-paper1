name: Audit Noordermeer 2005 arXiv HI atlas

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/audit-noordermeer2005-arxiv-atlas.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostScript tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ghostscript poppler-utils
      - name: Download and inventory Noordermeer 2005 source
        run: |
          mkdir -p /tmp/no05/src
          curl -A 'Mozilla/5.0 persistence-research/1.0' -L --fail --retry 3 \
            -o /tmp/no05/source.tar https://arxiv.org/e-print/astro-ph/0508319
          tar -tf /tmp/no05/source.tar | tee /tmp/no05/source_inventory.txt
          tar -xf /tmp/no05/source.tar -C /tmp/no05/src
          find /tmp/no05/src -type f -printf '%P,%s\n' | sort > /tmp/no05/source_files_sizes.csv
          find /tmp/no05/src -type f \( -iname '*.eps' -o -iname '*.ps' -o -iname '*.pdf' -o -iname '*.fig' \) -printf '%P,%s\n' | sort > /tmp/no05/graphics_inventory.csv
          python - <<'PY'
          import pathlib,re,csv
          root=pathlib.Path('/tmp/no05/src')
          cand=['UGC02487','UGC02916','UGC02953','UGC03205','UGC03546','UGC03580','UGC05253','UGC06786','UGC06787','UGC08699','UGC09133','UGC11914']
          def norm(s): return re.sub(r'[^A-Z0-9]','',s.upper())
          rows=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.ps','.eps','.tex','.txt','.fig'}: continue
              try: txt=p.read_text('latin1',errors='ignore')
              except: continue
              n=norm(txt); hits=[]
              for g in cand:
                  gs={norm(g),'UGC'+str(int(g[3:]))}
                  if any(x in n for x in gs): hits.append(g)
              if hits: rows.append((p.relative_to(root).as_posix(),p.stat().st_size,';'.join(hits)))
          with open('/tmp/no05/candidate_graphics_hits.csv','w',newline='') as f:
              w=csv.writer(f);w.writerow(['file','bytes','candidate_hits']);w.writerows(rows)
          print('candidate files',len(rows));
          for r in rows: print(r)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: noordermeer2005-arxiv-atlas-audit
          path: |
            /tmp/no05/source_inventory.txt
            /tmp/no05/source_files_sizes.csv
            /tmp/no05/graphics_inventory.csv
            /tmp/no05/candidate_graphics_hits.csv
