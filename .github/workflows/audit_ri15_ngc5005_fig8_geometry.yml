name: Audit Ri15 NGC5005 Figure 8 geometry

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit_ri15_ngc5005_fig8_geometry.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reuse proven inert arXiv EPS inspector for Ri15
        run: |
          cp scripts/stationary/audit_sg06_profile_panel_geometry.py /tmp/audit_ri15.py
          sed -i 's#astro-ph/0605542#1503.05981#g' /tmp/audit_ri15.py
          sed -i 's#sg06_profile_panel_geometry_audit_v1.json#ri15_ngc5005_fig8_geometry_v1.json#g' /tmp/audit_ri15.py
          sed -i 's#surface density profile#mass surface density#g' /tmp/audit_ri15.py
          python /tmp/audit_ri15.py
      - name: Commit audit artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/ri15_ngc5005_fig8_geometry_v1.json
          git commit -m 'Audit Ri15 NGC5005 Figure 8 source geometry' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
