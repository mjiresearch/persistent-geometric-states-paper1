name: Freeze stationary certified source profiles v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/stationary/stationary_hi_profile_rule_v1.py'
      - 'scripts/stationary/validate_hi_interpolation_rule_v1.py'
      - 'scripts/stationary/build_stationary_source_profile_freeze_v1.py'
      - 'scripts/stationary/validate_stationary_source_profile_freeze_v1.py'
      - 'validation/stationary/STATIONARY_HI_INTERPOLATION_CONTINUATION_POLICY_V1.md'
      - 'data/stationary/frozen/stationary_master_v1.csv'
      - 'data/stationary/source_reconstruction/certified_hi_normalization_manifest_v3.csv'
      - 'data/stationary/source_reconstruction/certified_hi_common_tabulated_v5.csv'
      - 'data/stationary/source_reconstruction/certified_hi_common_analytic_v5.csv'
      - 'validation/stationary/certified_hi_full_radial_coverage_v3.csv'
      - '.github/workflows/freeze_stationary_source_profiles_v1.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate frozen interpolation rule
        run: python scripts/stationary/validate_hi_interpolation_rule_v1.py

      - name: Build certified source-profile subset
        run: python scripts/stationary/build_stationary_source_profile_freeze_v1.py

      - name: Independently validate freeze package
        run: python scripts/stationary/validate_stationary_source_profile_freeze_v1.py

      - name: Require locked certified-subset state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path('validation/stationary/stationary_source_profile_freeze_v1_summary.json').read_text())
          validation = json.loads(Path('validation/stationary/stationary_source_profile_freeze_v1_validation.json').read_text())
          assert summary['status'] == 'STATIONARY_SOURCE_PROFILE_CERTIFIED_SUBSET_V1_FROZEN'
          assert summary['n_profiles'] == 34
          assert summary['profile_role_counts'] == {'calibration': 25, 'blind': 9}
          assert summary['n_tabulated_profiles'] == 27
          assert summary['n_analytic_profiles'] == 7
          assert summary['n_tabulated_requiring_inner_continuation'] == 11
          assert summary['n_tabulated_requiring_outer_continuation'] == 11
          assert summary['global_fit_gate_unlocked'] is False
          assert summary['source_current_evaluated'] is False
          assert summary['blind_outcome_inspected'] is False
          assert validation['all_pass'] is True
          PY

      - name: Commit deterministic freeze products
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/hi_interpolation_rule_v1_mock_validation.json
          git add data/stationary/processed/stationary_hi_profiles_v1.csv
          git add data/stationary/processed/stationary_source_profiles_v1.csv
          git add validation/stationary/stationary_source_profile_freeze_v1_summary.json
          git add validation/stationary/stationary_source_profile_freeze_v1_validation.json
          git add validation/stationary/STATIONARY_SOURCE_PROFILE_FREEZE_V1.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Freeze stationary certified source profiles v1'
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            git pull --rebase origin "$branch"
            if git push origin "HEAD:$branch"; then exit 0; fi
            sleep 2
          done
          exit 1
