name: Extract UGC4483 Figure 6 axis context
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/stationary/extract_ugc4483_fig6_axis_context.py'
      - '.github/workflows/extract_ugc4483_fig6_axis_context.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stationary/extract_ugc4483_fig6_axis_context.py
      - name: Commit axis checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/ugc4483_fig6_axis_context_v1.txt validation/stationary/ugc4483_fig6_axis_labels_v1.json
          if git diff --cached --quiet; then echo 'No changes'; else
            git commit -m 'Checkpoint UGC4483 Figure 6 native axes'
            for attempt in 1 2 3; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep 2; done
            exit 1
          fi
