name: Audit remaining Be91 original HI papers

on:
  push:
    branches: [main]
    paths:
      - 'scripts/stationary/audit_be91_remaining_original_hi_papers.py'
      - '.github/workflows/audit_be91_remaining_original_hi_papers.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet PyMuPDF
      - name: Audit three original observing papers
        run: python scripts/stationary/audit_be91_remaining_original_hi_papers.py
      - name: Commit source audits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/be91_remaining_original_hi_papers_audit_v1.json
          if git diff --cached --quiet; then echo 'No changes'; else
            git commit -m 'Audit remaining Be91 original HI papers'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
