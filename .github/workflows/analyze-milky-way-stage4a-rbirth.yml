name: Analyze Milky Way Stage 4A Rbirth

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze_milky_way_stage4a_rbirth.py'
      - '.github/workflows/analyze-milky-way-stage4a-rbirth.yml'

permissions:
  contents: write

jobs:
  stage4a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy pyarrow matplotlib scikit-learn
          pip install git+https://github.com/BridgetRatcliffe/Rbirth.git
      - name: Run and archive diagnostics
        shell: bash
        run: |
          mkdir -p data/persistence_history/milky_way_stage4a_rbirth
          set +e
          python scripts/analyze_milky_way_stage4a_rbirth.py > data/persistence_history/milky_way_stage4a_rbirth/run_output.txt 2>&1
          code=$?
          echo "$code" > data/persistence_history/milky_way_stage4a_rbirth/exit_code.txt
          cat data/persistence_history/milky_way_stage4a_rbirth/run_output.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/persistence_history/milky_way_stage4a_rbirth
          git diff --cached --quiet || git commit -m 'Archive Milky Way Stage 4A run'
          git push
          exit $code
