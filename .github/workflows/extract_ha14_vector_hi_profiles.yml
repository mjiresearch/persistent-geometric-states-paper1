name: Extract Ha14 native-vector HI profiles
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/stationary/extract_ha14_vector_hi_profiles.py'
      - '.github/workflows/extract_ha14_vector_hi_profiles.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stationary/extract_ha14_vector_hi_profiles.py
      - name: Commit recovered profiles
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/ha14_vector_hi_profile_extraction_v1.json data/stationary/source_reconstruction/ha14_vector_hi_profiles_v1.csv
          if git diff --cached --quiet; then echo 'No changes'; else
            git commit -m 'Recover Ha14 native-vector HI profiles'
            for attempt in 1 2 3; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep 2; done
            exit 1
          fi
