name: Open FEASTS 2024 profiles folder v1
on:
  push:
    paths:
      - 'scripts/stationary/open_feasts2024_profiles_folder_v1.py'
      - '.github/workflows/open_feasts2024_profiles_folder_v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - run: python scripts/stationary/open_feasts2024_profiles_folder_v1.py
      - name: Commit inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/feasts2024_profiles_folder_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Inventory FEASTS 2024 public profiles folder v1'
          git pull --rebase origin main
          git push origin HEAD:main
