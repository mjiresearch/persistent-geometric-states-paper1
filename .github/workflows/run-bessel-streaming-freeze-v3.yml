name: Run BeSSeL streaming freeze v3

on:
  push:
    paths:
      - 'data/persistence_history/hi4pi_grb_geometric_distance/bessel_streaming_frozen/CONVENTIONAL_BESSEL_STREAMING_FREEZE_V3.md'
      - 'data/persistence_history/hi4pi_grb_geometric_distance/bessel_streaming_frozen/build_bessel_streaming_field_v3.py'
      - 'data/persistence_history/hi4pi_grb_geometric_distance/bessel_streaming_frozen/frozen_grb_geometry_only.csv'
      - 'data/persistence_history/hi4pi_grb_geometric_distance/bessel_streaming_frozen/reid2019_table1.dat'
      - '.github/workflows/run-bessel-streaming-freeze-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze-v3:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade numpy pandas astropy

      - name: Build frozen V3 conventional field
        run: |
          python data/persistence_history/hi4pi_grb_geometric_distance/bessel_streaming_frozen/build_bessel_streaming_field_v3.py

      - name: Commit immutable V3 products
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/persistence_history/hi4pi_grb_geometric_distance/bessel_streaming_frozen/outputs_v3/
          if git diff --cached --quiet; then
            echo 'No V3 output changes to commit.'
          else
            git commit -m 'Freeze arm-conditioned BeSSeL streaming field v3 outputs'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
