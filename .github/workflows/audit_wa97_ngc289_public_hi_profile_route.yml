name: Audit Wa97 NGC289 public HI profile route

on:
  push:
    paths:
      - 'scripts/stationary/audit_wa97_ngc289_public_hi_profile_route.py'
      - '.github/workflows/audit_wa97_ngc289_public_hi_profile_route.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pymupdf
      - name: Audit public original-article route
        run: python scripts/stationary/audit_wa97_ngc289_public_hi_profile_route.py
      - name: Commit compact audit race-safe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/wa97_ngc289_public_hi_profile_route_v1.json validation/stationary/wa97_ngc289_public_hi_profile_route_v1.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit Wa97 NGC289 public HI profile route'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python scripts/stationary/audit_wa97_ngc289_public_hi_profile_route.py
            git add validation/stationary/wa97_ngc289_public_hi_profile_route_v1.json validation/stationary/wa97_ngc289_public_hi_profile_route_v1.txt
            git commit -m 'Audit Wa97 NGC289 public HI profile route' || true
            sleep 2
          done
          exit 1
