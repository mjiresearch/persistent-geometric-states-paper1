name: Audit VH93 public HI profile route

on:
  push:
    branches: [main]
    paths:
      - 'scripts/stationary/audit_vh93_public_profile_route.py'
      - '.github/workflows/audit_vh93_public_profile_route.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF inspection dependency
        run: pip install pymupdf
      - name: Audit public VH93 PDF
        run: python scripts/stationary/audit_vh93_public_profile_route.py
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/vh93_public_profile_route_audit_v1.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Audit VH93 public radial HI profile route'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
