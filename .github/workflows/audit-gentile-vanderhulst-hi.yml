name: Audit Gentile and van der Hulst HI sources

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/audit-gentile-vanderhulst-hi.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils ghostscript
          pip install pandas
      - name: Audit public sources against frozen sample
        run: |
          set -euxo pipefail
          mkdir -p /tmp/gv/gentile/src /tmp/gv/vdh
          curl -A 'Mozilla/5.0 persistence-research/1.0' -L --fail --retry 3 -o /tmp/gv/gentile/source.tar https://arxiv.org/e-print/astro-ph/0403154
          tar -xf /tmp/gv/gentile/source.tar -C /tmp/gv/gentile/src
          # Case Digital Commons public final-publisher version; endpoint may reject automation, preserve status.
          curl -A 'Mozilla/5.0' -e 'https://commons.case.edu/facultyworks/805/' -L -sS -w '%{http_code}\n' -o /tmp/gv/vdh/vdh1993.pdf 'https://commons.case.edu/cgi/viewcontent.cgi?article=1808&context=facultyworks' > /tmp/gv/vdh/http_status.txt || true
          python - <<'PY'
          from pathlib import Path
          import pandas as pd,re,csv,subprocess,os
          master=pd.read_csv('data/stationary/frozen/stationary_master_v1.csv')
          gals=sorted(master.galaxy.unique())
          def variants(g):
              cg=re.sub(r'[^A-Z0-9]','',g.upper())
              return {cg,re.sub(r'^(UGC|NGC|IC)0+',r'\1',cg)}
          def scan_text(label,text):
              norm=re.sub(r'[^A-Z0-9]','',text.upper())
              hits=[g for g in gals if any(v and v in norm for v in variants(g))]
              pd.DataFrame({'galaxy':hits}).to_csv(f'/tmp/gv/{label}_frozen_hits.csv',index=False)
              print(label,len(hits),hits)
          files=[p for p in Path('/tmp/gv/gentile/src').rglob('*') if p.is_file()]
          text='\n'.join(p.read_bytes().decode('latin1','ignore') for p in files)
          scan_text('gentile',text)
          with open('/tmp/gv/gentile_inventory.csv','w',newline='') as f:
              w=csv.writer(f);w.writerow(['file','bytes']);
              for p in files:w.writerow([str(p.relative_to('/tmp/gv/gentile/src')),p.stat().st_size])
          pdf=Path('/tmp/gv/vdh/vdh1993.pdf')
          if pdf.exists() and pdf.stat().st_size>10000 and pdf.read_bytes()[:4]==b'%PDF':
              subprocess.run(['pdftotext','-layout',str(pdf),'/tmp/gv/vdh/vdh1993.txt'],check=False)
              scan_text('vanderhulst',Path('/tmp/gv/vdh/vdh1993.txt').read_text(errors='ignore'))
              subprocess.run(['pdfimages','-list',str(pdf)],stdout=open('/tmp/gv/vdh/pdfimages_list.txt','w'),check=False)
              subprocess.run(['pdfinfo',str(pdf)],stdout=open('/tmp/gv/vdh/pdfinfo.txt','w'),check=False)
          else:
              Path('/tmp/gv/vanderhulst_frozen_hits.csv').write_text('galaxy\n')
              Path('/tmp/gv/vdh/pdfinfo.txt').write_text('public PDF endpoint not retrieved by runner\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gentile-vanderhulst-hi-audit
          path: |
            /tmp/gv/gentile_frozen_hits.csv
            /tmp/gv/gentile_inventory.csv
            /tmp/gv/vanderhulst_frozen_hits.csv
            /tmp/gv/vdh/http_status.txt
            /tmp/gv/vdh/pdfinfo.txt
            /tmp/gv/vdh/pdfimages_list.txt
          if-no-files-found: ignore
