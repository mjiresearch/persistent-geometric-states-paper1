name: Audit normalization-ready HI profile coverage

on:
  push:
    paths:
      - 'scripts/stationary/audit_normalization_ready_profile_coverage.py'
      - '.github/workflows/audit_normalization_ready_profile_coverage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stationary/audit_normalization_ready_profile_coverage.py
      - name: Commit coverage audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/normalization_ready_profile_coverage_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit normalization-ready HI profile coverage'
          git pull --rebase origin main
          git push origin HEAD:main
