name: Analyze Milky Way Stage 6B Pulsar History

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze_milky_way_stage6b_pulsar_source_history_alignment.py'
      - '.github/workflows/analyze-milky-way-stage6b-pulsar-history.yml'

permissions:
  contents: write

concurrency:
  group: milky-way-stage6b-pulsar-history
  cancel-in-progress: true

jobs:
  stage6b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy
      - name: Run Stage 6B
        shell: bash
        run: |
          mkdir -p data/persistence_history/milky_way_stage6b_pulsar_history_alignment
          set +e
          python scripts/analyze_milky_way_stage6b_pulsar_source_history_alignment.py > data/persistence_history/milky_way_stage6b_pulsar_history_alignment/run_output.txt 2>&1
          code=$?
          echo $code > data/persistence_history/milky_way_stage6b_pulsar_history_alignment/exit_code.txt
          cat data/persistence_history/milky_way_stage6b_pulsar_history_alignment/run_output.txt
          exit 0
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/persistence_history/milky_way_stage6b_pulsar_history_alignment
          git diff --cached --quiet || git commit -m 'Add Milky Way Stage 6B pulsar-history results'
          git pull --rebase origin main
          git push
