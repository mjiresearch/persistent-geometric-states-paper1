name: Audit Leroy HI profile extent versus stationary grid
on:
  push:
    paths:
      - 'scripts/stationary/audit_leroy2008_profile_extent_vs_stationary_grid.py'
      - '.github/workflows/audit_leroy2008_profile_extent_vs_stationary_grid.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stationary/audit_leroy2008_profile_extent_vs_stationary_grid.py
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/leroy2008_profile_extent_vs_stationary_grid_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit Leroy HI profile extent versus stationary grid'
          git pull --rebase origin main
          git push origin HEAD:main
