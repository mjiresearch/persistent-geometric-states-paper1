name: Extract dB02 Table 1 HI source codes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/stationary/extract_db02_table1_hi_source_codes.py'
      - '.github/workflows/extract_db02_table1_hi_source_codes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract Table 1 source codes
        run: python scripts/stationary/extract_db02_table1_hi_source_codes.py
      - name: Commit extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/db02_table1_hi_source_codes_v1.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Extract dB02 Table 1 HI source codes'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
