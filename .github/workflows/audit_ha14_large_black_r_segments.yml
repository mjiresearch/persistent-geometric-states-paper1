name: Audit Ha14 large black R segments
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/stationary/audit_ha14_large_black_r_segments.py'
      - '.github/workflows/audit_ha14_large_black_r_segments.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stationary/audit_ha14_large_black_r_segments.py
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/ha14_large_black_r_segments_v1.json
          if git diff --cached --quiet; then echo 'No changes'; else
            git commit -m 'Audit Ha14 large black R segments'
            for attempt in 1 2 3; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep 2; done
            exit 1
          fi
