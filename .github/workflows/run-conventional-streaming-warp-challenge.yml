name: Run conventional streaming warp challenge

on:
  push:
    paths:
      - 'data/persistence_history/hi4pi_grb_geometric_distance/conventional_challenge.py'
      - '.github/workflows/run-conventional-streaming-warp-challenge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas

      - name: Run challenge
        run: |
          python data/persistence_history/hi4pi_grb_geometric_distance/conventional_challenge.py

      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/persistence_history/hi4pi_grb_geometric_distance/conventional_challenge/
          if git diff --cached --quiet; then
            echo 'No output changes.'
          else
            git commit -m 'Run conventional streaming and warp challenge'
            git pull --rebase origin main
            git push origin main
          fi
