name: Audit certified HI normalization readiness

on:
  push:
    paths:
      - 'scripts/stationary/audit_certified_hi_normalization_readiness.py'
      - '.github/workflows/audit_certified_hi_normalization_readiness.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stationary/audit_certified_hi_normalization_readiness.py
      - name: Commit readiness audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/certified_hi_normalization_readiness_v1.csv validation/stationary/certified_hi_normalization_readiness_v1_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit certified HI normalization readiness'
          git pull --rebase origin main
          git push origin HEAD:main
