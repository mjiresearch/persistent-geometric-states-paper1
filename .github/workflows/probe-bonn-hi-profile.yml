name: Probe Bonn HI profile endpoint

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-bonn-hi-profile.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch public form source
        run: |
          OUT=data/persistence_history/hi4pi_grb_geometric_distance/bonn_probe
          mkdir -p "$OUT"
          curl -fL --retry 3 --connect-timeout 20 --max-time 60 \
            'https://www.astro.uni-bonn.de/hisurvey/AllSky_gauss/index.php' \
            -o "$OUT/index.html"
          grep -niE '<form|<input|<select|<option|action=|name=' "$OUT/index.html" > "$OUT/form_fields.txt" || true
          head -200 "$OUT/form_fields.txt"
      - name: Commit probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/persistence_history/hi4pi_grb_geometric_distance/bonn_probe
          git commit -m 'Probe Bonn HI profile form endpoint' || exit 0
          git push
