name: Build public HI reference crosswalk v1

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/stationary/build_public_hi_reference_crosswalk_v1.py'
      - 'validation/stationary/stationary_split_v1.csv'

permissions:
  contents: write

jobs:
  build-crosswalk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build frozen-sample SPARC reference crosswalk
        run: python scripts/stationary/build_public_hi_reference_crosswalk_v1.py --download
      - name: Commit crosswalk
        if: github.ref_type == 'branch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stationary/source_reconstruction/stationary_hi_reference_crosswalk_v1.csv
          git diff --cached --quiet || git commit -m 'Add stationary public HI reference crosswalk v1'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
