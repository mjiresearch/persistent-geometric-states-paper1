name: Recover VM97 NGC6015 native HI profile

on:
  push:
    paths:
      - 'scripts/stationary/recover_vm97_ngc6015_native_hi_profile.py'
      - '.github/workflows/recover_vm97_ngc6015_native_hi_profile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy
      - name: Recover source-native Figure-3d profile
        run: python scripts/stationary/recover_vm97_ngc6015_native_hi_profile.py
      - name: Commit recovery products race-safe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stationary/source_reconstruction/vm97_ngc6015_hi_profile_v1.csv \
                  validation/stationary/vm97_ngc6015_native_hi_profile_recovery_v1.json \
                  validation/stationary/vm97_ngc6015_axis_label_calibration_v1.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Recover VM97 NGC6015 native-vector HI profile'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python -m pip install --quiet numpy
            python scripts/stationary/recover_vm97_ngc6015_native_hi_profile.py
            git add data/stationary/source_reconstruction/vm97_ngc6015_hi_profile_v1.csv validation/stationary/vm97_ngc6015_native_hi_profile_recovery_v1.json validation/stationary/vm97_ngc6015_axis_label_calibration_v1.txt
            git commit -m 'Recover VM97 NGC6015 native-vector HI profile' || true
            sleep 2
          done
          exit 1
