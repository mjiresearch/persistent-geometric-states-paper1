name: Analyze Milky Way Stage 4F Common Grid

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze_milky_way_stage4f_common_grid_young_tracer.py'
      - '.github/workflows/analyze-milky-way-stage4f-common-grid.yml'

concurrency:
  group: milky-way-stage4f-common-grid
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  stage4f:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas scipy scikit-learn
      - name: Run Stage 4F
        shell: bash
        run: |
          mkdir -p data/persistence_history/milky_way_stage4f_common_grid_young_tracer
          set +e
          python scripts/analyze_milky_way_stage4f_common_grid_young_tracer.py > data/persistence_history/milky_way_stage4f_common_grid_young_tracer/run_output.txt 2>&1
          code=$?
          echo $code > data/persistence_history/milky_way_stage4f_common_grid_young_tracer/exit_code.txt
          cat data/persistence_history/milky_way_stage4f_common_grid_young_tracer/run_output.txt
          exit 0
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/persistence_history/milky_way_stage4f_common_grid_young_tracer
          git diff --cached --quiet || git commit -m 'Add Milky Way Stage 4F common-grid results'
          git pull --rebase origin main
          git push
