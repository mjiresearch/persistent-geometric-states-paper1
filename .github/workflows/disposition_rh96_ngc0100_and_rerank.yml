name: Disposition Rh96 and Ri15 then rerank

on:
  push:
    paths:
      - 'scripts/stationary/disposition_rh96_ngc0100.py'
      - 'scripts/stationary/disposition_ri15_ngc5005.py'
      - '.github/workflows/disposition_rh96_ngc0100_and_rerank.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  disposition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stationary/disposition_rh96_ngc0100.py
      - run: python scripts/stationary/disposition_ri15_ngc5005.py
      - run: python scripts/stationary/rank_sparc_hi_reference_families.py
      - run: python scripts/stationary/update_project_ledger_hi_checkpoint.py
      - name: Commit dispositions and rerank
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stationary/source_reconstruction/sparc_hi_reference_family_disposition_v1.csv data/stationary/source_reconstruction/sparc_hi_reference_family_priority_v1.csv validation/stationary/sparc_hi_reference_family_priority_v1_summary.json validation/stationary/CHECKPOINT_RH96_NGC0100_PUBLIC_ROUTE.md validation/stationary/CHECKPOINT_RI15_NGC5005_PUBLIC_ROUTE.md PROJECT_LEDGER.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Disposition Ri15 NGC5005 and rerank'
          git pull --rebase origin main
          git push origin HEAD:main
