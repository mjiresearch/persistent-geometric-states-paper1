name: Summarize VM97 NGC6015 Figure 3 PGPLOT geometry

on:
  push:
    paths:
      - 'scripts/stationary/summarize_vm97_ngc6015_fig3_pgplot_geometry.py'
      - '.github/workflows/summarize_vm97_ngc6015_fig3_pgplot_geometry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Summarize source-native PGPLOT geometry
        run: python scripts/stationary/summarize_vm97_ngc6015_fig3_pgplot_geometry.py
      - name: Commit compact summary race-safe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/vm97_ngc6015_fig3_pgplot_geometry_summary_v1.json validation/stationary/vm97_ngc6015_fig3_pgplot_geometry_summary_v1.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Summarize VM97 NGC6015 Figure 3 PGPLOT geometry'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python scripts/stationary/summarize_vm97_ngc6015_fig3_pgplot_geometry.py
            git add validation/stationary/vm97_ngc6015_fig3_pgplot_geometry_summary_v1.json validation/stationary/vm97_ngc6015_fig3_pgplot_geometry_summary_v1.txt
            git commit -m 'Summarize VM97 NGC6015 Figure 3 PGPLOT geometry' || true
            sleep 2
          done
          exit 1
