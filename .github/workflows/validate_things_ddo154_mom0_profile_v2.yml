name: Validate THINGS DDO154 MOM0 profile v2
on:
  push:
    paths:
      - 'scripts/stationary/validate_things_ddo154_mom0_profile_v2.py'
      - '.github/workflows/validate_things_ddo154_mom0_profile_v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install --disable-pip-version-check numpy astropy
      - name: Run DDO154 validation with Walter metadata
        id: scientific
        shell: bash
        run: |
          set +e
          python scripts/stationary/validate_things_ddo154_mom0_profile_v2.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit validation diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stationary/source_reconstruction/things_ddo154_mom0_reconstructed_raw_hi_v2.csv validation/stationary/things_ddo154_mom0_validation_v2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Validate DDO154 THINGS MOM0 reconstruction v2'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report scientific gate result
        run: |
          if [ "${{ steps.scientific.outputs.exit_code }}" != "0" ]; then
            echo "DDO154 source-domain validation did not pass all frozen gates"
            exit 1
          fi
