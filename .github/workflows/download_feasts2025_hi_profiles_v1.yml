name: Download FEASTS 2025 H I profiles v1
on:
  push:
    paths:
      - 'scripts/stationary/download_feasts2025_hi_profiles_v1.py'
      - '.github/workflows/download_feasts2025_hi_profiles_v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Download public ECSV
        run: python scripts/stationary/download_feasts2025_hi_profiles_v1.py
      - name: Commit public ECSV and audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stationary/source_reconstruction/feasts2025_HIprof_wang25.ecsv validation/stationary/feasts2025_hi_profiles_download_v1.json
          git commit -m 'Ingest FEASTS 2025 public H I profile release v1'
          git pull --rebase origin main
          git push origin HEAD:main
