name: Extract Walter 2008 natural beams v1
on:
  push:
    paths:
      - 'scripts/stationary/extract_walter2008_natural_beams_v1.py'
      - '.github/workflows/extract_walter2008_natural_beams_v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stationary/extract_walter2008_natural_beams_v1.py
      - name: Commit extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/walter2008_natural_beam_extraction_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Extract Walter 2008 natural beams v1'
          git pull --rebase origin main
          git push origin HEAD:main
