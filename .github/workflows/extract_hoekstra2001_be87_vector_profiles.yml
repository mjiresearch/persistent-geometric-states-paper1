name: Extract Hoekstra 2001 Be87 vector profiles

on:
  push:
    branches: [main]
    paths:
      - 'scripts/stationary/extract_hoekstra2001_be87_vector_profiles.py'
      - '.github/workflows/extract_hoekstra2001_be87_vector_profiles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf
      - name: Extract exact compiled-PDF vector profiles
        run: python scripts/stationary/extract_hoekstra2001_be87_vector_profiles.py
      - name: Commit candidate profiles and QC
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stationary/source_reconstruction/hoekstra2001_be87_hi_vector_profiles_candidate_v1.csv validation/stationary/hoekstra2001_be87_hi_vector_profiles_candidate_v1_summary.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Recover Hoekstra Be87 vector HI profile candidates'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
