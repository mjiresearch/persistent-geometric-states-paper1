name: Extract Gentile NGC1090 HI vector

on:
  pull_request:
    paths:
      - '.github/workflows/extract_gentile_ngc1090_vector.yml'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install vector tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ghostscript pstoedit
      - name: Recover original EPS and convert vector geometry
        run: |
          set -euxo pipefail
          mkdir -p /tmp/g1090v/src /tmp/g1090v/out
          curl -A 'Mozilla/5.0 persistence-research/1.0' -L --fail --retry 3 -o /tmp/g1090v/source.tar https://arxiv.org/e-print/astro-ph/0403154
          tar -xf /tmp/g1090v/source.tar -C /tmp/g1090v/src
          cp /tmp/g1090v/src/fig2.eps /tmp/g1090v/out/fig2.eps
          pstoedit -f plot-svg /tmp/g1090v/src/fig2.eps /tmp/g1090v/out/fig2.svg || true
          grep -n -E 'circle|ellipse|polygon|path|polyline' /tmp/g1090v/out/fig2.svg > /tmp/g1090v/out/vector_elements.txt || true
          sha256sum /tmp/g1090v/src/fig2.eps > /tmp/g1090v/out/fig2.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gentile-ngc1090-hi-vector
          path: /tmp/g1090v/out
