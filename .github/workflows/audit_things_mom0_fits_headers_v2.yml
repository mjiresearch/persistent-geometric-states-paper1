name: Audit THINGS MOM0 FITS headers v2
on:
  push:
    paths:
      - 'scripts/stationary/audit_things_mom0_fits_headers_v2.py'
      - '.github/workflows/audit_things_mom0_fits_headers_v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stationary/audit_things_mom0_fits_headers_v2.py
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/things_mom0_fits_header_audit_v2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit THINGS MOM0 FITS headers v2'
          git pull --rebase origin main
          git push origin HEAD:main
