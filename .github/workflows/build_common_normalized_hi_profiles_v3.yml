name: Build common normalized HI profiles v3
on:
  push:
    paths:
      - 'scripts/stationary/build_common_normalized_hi_profiles_v3.py'
      - '.github/workflows/build_common_normalized_hi_profiles_v3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stationary/build_common_normalized_hi_profiles_v3.py
      - name: Commit common normalized products
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stationary/source_reconstruction/certified_hi_common_tabulated_v3.csv data/stationary/source_reconstruction/certified_hi_common_analytic_v3.csv validation/stationary/certified_hi_common_normalized_v3_summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build common normalized HI source products v3'
          git pull --rebase origin main
          git push origin HEAD:main
