name: Map Bl99 NGC5585 figures

on:
  push:
    paths:
      - 'scripts/stationary/map_bl99_ngc5585_figures.py'
      - '.github/workflows/map_bl99_ngc5585_figures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Map figures
        run: python scripts/stationary/map_bl99_ngc5585_figures.py
      - name: Commit map race-safe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/bl99_ngc5585_figure_map_v1.json validation/stationary/bl99_ngc5585_figure_map_v1.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Map Bl99 NGC5585 source figures'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python scripts/stationary/map_bl99_ngc5585_figures.py
            git add validation/stationary/bl99_ngc5585_figure_map_v1.json validation/stationary/bl99_ngc5585_figure_map_v1.txt
            git commit -m 'Map Bl99 NGC5585 source figures' || true
            sleep 2
          done
          exit 1
