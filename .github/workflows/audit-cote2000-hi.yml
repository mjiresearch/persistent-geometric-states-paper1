name: Audit Cote 2000 public HI profiles
on:
  pull_request:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          pip install pandas beautifulsoup4 requests
      - name: Retrieve correct Cote 2000 paper and crossmatch frozen sample
        run: |
          set -euxo pipefail
          mkdir -p /tmp/cote2000
          python - <<'PY'
          import requests,re,os
          from bs4 import BeautifulSoup
          urls=[
            'https://openresearch-repository.anu.edu.au/items/33c6d420-c91a-4cfe-88f4-c77f61230774',
            'https://dspace-test.anu.edu.au/items/22fb892d-c856-4cd5-959f-be322540bec8/full'
          ]
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 persistence-research/1.0'
          links=[]
          for u in urls:
            try:
              r=s.get(u,timeout=30); open('/tmp/cote2000/page.html','wb').write(r.content)
              soup=BeautifulSoup(r.text,'html.parser')
              for a in soup.find_all('a',href=True):
                h=a['href']
                if any(x in h.lower() for x in ['bitstream','download','.pdf']):
                  links.append(requests.compat.urljoin(u,h))
            except Exception as e: print('PAGEERR',u,e)
          print('candidate_links',*links,sep='\n')
          for i,u in enumerate(dict.fromkeys(links)):
            try:
              r=s.get(u,timeout=60,allow_redirects=True)
              p=f'/tmp/cote2000/candidate_{i}.pdf'; open(p,'wb').write(r.content)
              if r.content[:4]==b'%PDF' and len(r.content)>10000:
                os.rename(p,'/tmp/cote2000/cote2000.pdf'); print('PDF_OK',u,len(r.content)); break
            except Exception as e: print('PDFERR',u,e)
          PY
          if [ -f /tmp/cote2000/cote2000.pdf ]; then
            pdftotext -layout /tmp/cote2000/cote2000.pdf /tmp/cote2000/cote2000.txt
            pdfimages -list /tmp/cote2000/cote2000.pdf > /tmp/cote2000/pdfimages.txt
          else
            echo 'NO_PDF_RECOVERED' > /tmp/cote2000/cote2000.txt
          fi
          python - <<'PY'
          import pandas as pd,re
          from pathlib import Path
          master=pd.read_csv('data/stationary/frozen/stationary_master_v1.csv')
          text=Path('/tmp/cote2000/cote2000.txt').read_text(errors='ignore')
          norm=re.sub(r'[^A-Z0-9]','',text.upper())
          hits=[]
          for g in sorted(master.galaxy.unique()):
            cg=re.sub(r'[^A-Z0-9]','',g.upper())
            vars={cg,re.sub(r'^(UGC|NGC|IC)0+',r'\1',cg)}
            if any(v and v in norm for v in vars): hits.append(g)
          pd.DataFrame({'galaxy':hits}).to_csv('/tmp/cote2000/frozen_hits.csv',index=False)
          print('FROZEN_HITS',hits)
          low=text.lower()
          for term in ['surface density','surface-density','radial distribution','h i distribution','hi distribution']:
            print(term,[m.start() for m in re.finditer(term,low)][:30])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cote2000-hi-audit
          path: /tmp/cote2000/
