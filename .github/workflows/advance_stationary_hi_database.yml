name: Advance stationary HI database

on:
  push:
    branches: [main]
    paths:
      - 'scripts/stationary/integrate_elson2017_whisp_candidates_into_overlay.py'
      - 'scripts/stationary/rank_sparc_hi_reference_families.py'
      - '.github/workflows/advance_stationary_hi_database.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  advance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate WHISP vector candidates into public overlay
        run: python scripts/stationary/integrate_elson2017_whisp_candidates_into_overlay.py
      - name: Reconcile frozen-149 provenance
        run: python scripts/stationary/reconcile_public_hi_source_overlay_v1.py
      - name: Rank remaining source families from Lelli SPARC references
        run: python scripts/stationary/rank_sparc_hi_reference_families.py
      - name: Show compact results
        run: |
          cat validation/stationary/stationary_hi_profile_provenance_reconciled_v1_summary.json
          echo '---'
          cat validation/stationary/sparc_hi_reference_family_priority_v1_summary.json
      - name: Commit advanced database products
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            data/stationary/source_reconstruction/stationary_public_hi_source_overlay_v1.csv \
            data/stationary/source_reconstruction/stationary_hi_profile_provenance_reconciled_v1.csv \
            validation/stationary/stationary_hi_profile_provenance_reconciled_v1_summary.json \
            data/stationary/source_reconstruction/sparc_hi_reference_family_priority_v1.csv \
            validation/stationary/sparc_hi_reference_family_priority_v1_summary.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Advance stationary HI public-source database'
            git push
          fi
