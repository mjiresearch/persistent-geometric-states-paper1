name: Build Lelli 2016 HI origin map

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/stationary/build_lelli2016_hi_origin_map.py
      - validation/stationary/stationary_split_v1.csv

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build per-galaxy Lelli source map
        run: python scripts/stationary/build_lelli2016_hi_origin_map.py
      - name: Show summary
        run: cat validation/stationary/lelli2016_hi_data_origin_map_v1_summary.json
      - name: Commit generated provenance products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stationary/source_reconstruction/lelli2016_hi_data_origin_map_v1.csv \
                  validation/stationary/lelli2016_hi_data_origin_map_v1_summary.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build frozen-sample Lelli 2016 HI source map"
            git push
          fi
