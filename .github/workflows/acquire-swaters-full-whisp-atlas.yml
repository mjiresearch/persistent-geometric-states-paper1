name: Acquire Swaters full WHISP atlas
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  acquire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download author-hosted full-figure PostScript
        run: |
          set -euxo pipefail
          mkdir -p /tmp/swaters_full
          curl -A 'Mozilla/5.0 persistence-research/1.0' -L --fail --retry 4 --connect-timeout 30 --max-time 300 \
            -o /tmp/swaters_full/WHISPI.ps.gz https://www.robswork.net/publications/WHISPI.ps.gz
          gzip -dc /tmp/swaters_full/WHISPI.ps.gz > /tmp/swaters_full/WHISPI.ps
          sha256sum /tmp/swaters_full/WHISPI.ps.gz /tmp/swaters_full/WHISPI.ps > /tmp/swaters_full/checksums.txt
          ls -lh /tmp/swaters_full/WHISPI.ps.gz /tmp/swaters_full/WHISPI.ps > /tmp/swaters_full/sizes.txt
          grep -aoE 'UGC[[:space:]]*[0-9]{2,5}|NGC[[:space:]]*[0-9]{2,5}|DDO[[:space:]]*[0-9]{1,3}|IC[[:space:]]*[0-9]{2,5}' /tmp/swaters_full/WHISPI.ps | sort -u > /tmp/swaters_full/galaxy_tokens.txt || true
          grep -aic 'surface density' /tmp/swaters_full/WHISPI.ps > /tmp/swaters_full/surface_density_hits.txt || true
          grep -aic 'M.*pc' /tmp/swaters_full/WHISPI.ps > /tmp/swaters_full/unit_hits.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: swaters-full-whisp-atlas
          path: |
            /tmp/swaters_full/WHISPI.ps.gz
            /tmp/swaters_full/checksums.txt
            /tmp/swaters_full/sizes.txt
            /tmp/swaters_full/galaxy_tokens.txt
            /tmp/swaters_full/surface_density_hits.txt
            /tmp/swaters_full/unit_hits.txt
          compression-level: 0
