name: Inspect Valis DR20 endpoint schemas
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/inspect_valis_dr20_schema.py'
      - '.github/workflows/run-valis-dr20-schema-inspection.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/inspect_valis_dr20_schema.py
      - name: Commit schema audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/osc_rv_target_rank/sdss_dr20_recovery/valis_endpoint_schemas.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record Valis DR20 endpoint schemas'
            git pull --rebase origin main
            git push
          fi
