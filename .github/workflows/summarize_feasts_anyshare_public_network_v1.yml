name: Summarize FEASTS AnyShare public network v1
on:
  push:
    paths:
      - 'scripts/stationary/summarize_feasts_anyshare_public_network_v1.py'
      - '.github/workflows/summarize_feasts_anyshare_public_network_v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stationary/summarize_feasts_anyshare_public_network_v1.py
      - name: Commit summary
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/feasts_anyshare_public_inventory_seed_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Summarize FEASTS AnyShare public inventory seed v1'
          git pull --rebase origin main
          git push origin HEAD:main
