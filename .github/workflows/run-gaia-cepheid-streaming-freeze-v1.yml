name: Run Gaia-Cepheid streaming freeze v1
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/build_gaia_cepheid_streaming_v1.py'
      - 'data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/GAIA_CEPHEID_STREAMING_FREEZE_V1.md'
      - '.github/workflows/run-gaia-cepheid-streaming-freeze-v1.yml'
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy pandas astropy requests
      - name: Build frozen outcome-blind Cepheid field
        run: python data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/build_gaia_cepheid_streaming_v1.py
      - name: Commit immutable frozen products
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/gaia_dr3_classical_cepheids_table2.dat || true
          git add data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/gaia_dr3_6d_join.csv || true
          git add data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/outputs_v1
          if ! git diff --cached --quiet; then
            git commit -m 'Freeze Gaia-Cepheid arm-conditioned streaming field v1 outputs'
            git push
          fi
