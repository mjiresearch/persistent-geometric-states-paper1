name: Build DR20 persistence master

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_dr20_persistence_master.py'
      - '.github/workflows/build-dr20-persistence-master.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests astropy pandas pyarrow

      - name: Build verified DR20 persistence master
        run: python scripts/build_dr20_persistence_master.py

      - name: Show outputs
        run: |
          find data/persistence_history/dr20_master -maxdepth 1 -type f -printf '%p %s bytes\n' | sort
          cat data/persistence_history/dr20_master/README.md

      - name: Commit master dataset and join diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/persistence_history/dr20_master
          if git diff --cached --quiet; then
            echo 'No master-data changes to commit.'
          else
            git commit -m 'Build unified DR20 persistence master'
            git push
          fi
