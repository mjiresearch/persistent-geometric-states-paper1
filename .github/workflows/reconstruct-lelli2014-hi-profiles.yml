name: Reconstruct Lelli 2014 public HI profiles

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/reconstruct-lelli2014-hi-profiles.yml'
      - 'data/stationary/source_reconstruction/lelli2014_public_cube_manifest_v1.csv'

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas astropy scipy
      - name: Download public cubes
        run: |
          mkdir -p /tmp/lelli
          python - <<'PY'
          import csv,pathlib,urllib.request
          for r in csv.DictReader(open('data/stationary/source_reconstruction/lelli2014_public_cube_manifest_v1.csv')):
              p=pathlib.Path('/tmp/lelli')/r['filename']; urllib.request.urlretrieve(r['download_url'],p); print(r['galaxy'],p.stat().st_size)
          PY
      - name: Reconstruct UGC04483 with published Lelli 2012 mask
        run: |
          python - <<'PY'
          import numpy as np, pandas as pd
          from astropy.io import fits
          from astropy.wcs import WCS
          from scipy.ndimage import gaussian_filter
          from pathlib import Path

          c=299792.458; nu=1.42040575177
          cube_path=Path('/tmp/lelli/UGC4483_HIcube_r10.FIT')
          with fits.open(cube_path,memmap=True) as hd:
              x=np.asarray(hd[0].data,dtype=float).squeeze(); h=hd[0].header.copy()
          # Published final science cube: 10 arcsec beam, 5.2 km/s channels, rms 0.66 mJy/beam.
          # Published mask: smooth to 20 arcsec spatial and 10.4 km/s spectral, clip at about 3 sigma_s,
          # then sum the original 10 arcsec cube only inside that mask.
          pix_as=abs(float(h['CDELT1']))*3600.
          science_beam=10.0; target_beam=20.0; science_dv=5.2; target_dv=10.4
          sig_xy=np.sqrt(target_beam**2-science_beam**2)/2.354820045/pix_as
          sig_v=np.sqrt(target_dv**2-science_dv**2)/2.354820045/science_dv
          finite=np.isfinite(x); work=np.where(finite,x,0.0)
          sm=gaussian_filter(work,sigma=(sig_v,sig_xy,sig_xy),mode='constant',cval=0.0)
          # robust sigma_s from all smoothed voxels; source occupies a tiny fraction of cube
          med=np.nanmedian(sm); sigs=1.4826*np.nanmedian(np.abs(sm-med))
          mask=sm > 3.0*sigs
          # Exact optical-radio conversion of channel frequency increment to local velocity width.
          df=abs(float(h['CDELT3'])); dv=c*df/nu/1e9
          mom0=np.sum(np.where(mask & finite,x,0.0),axis=0)*dv
          # Convert Jy/beam km/s to N_HI for 10x10 arcsec science beam.
          tb_per_jy=1.222e6/(nu**2*science_beam*science_beam)
          nhi=mom0*tb_per_jy*1.823e18
          nhi=np.where(np.sum(mask,axis=0)>0,nhi,np.nan)

          # Published kinematic center and geometry; frozen SPARC distance/inclination agree with i=58 deg.
          w=WCS(h).celestial
          ra=15*(8+37/60+3.4/3600); dec=69+46/60+31/3600
          xc,yc=w.world_to_pixel_values(ra,dec)
          dist=3.34; inc=np.deg2rad(58.0); pa=np.deg2rad(0.0)
          yy,xx=np.indices(nhi.shape); dx=(xx-xc)*pix_as; dy=(yy-yc)*pix_as
          # PA=0 deg measured N through E: major axis along Dec/y; rotate so xp is major-axis coordinate.
          xp=dy*np.cos(pa)+dx*np.sin(pa); yp=-dy*np.sin(pa)+dx*np.cos(pa)
          rell_as=np.sqrt(xp*xp+(yp/np.cos(inc))**2); kpc_as=dist*1e3/206265.; rell=rell_as*kpc_as
          beam_kpc=science_beam*kpc_as; dr=.5*beam_kpc; central=2*beam_kpc
          valid=np.isfinite(nhi)&(nhi>0); edges=np.arange(0,np.nanmax(rell[valid])+dr,dr); rows=[]
          for lo,hi in zip(edges[:-1],edges[1:]):
              m=(rell>=lo)&(rell<hi); z=nhi[m&valid]/1.249e20
              if m.sum()<10: continue
              rows.append({'name':'UGC04483','r_kpc':.5*(lo+hi),'Sigma_HI_Msun_pc2':float(np.nanmedian(z)) if z.size else np.nan,
                           'Sigma_HI_p16':float(np.nanpercentile(z,16)) if z.size else np.nan,'Sigma_HI_p84':float(np.nanpercentile(z,84)) if z.size else np.nan,
                           'n_pix_mom0':int(z.size),'beam_smeared_mask':bool(.5*(lo+hi)<central),'source_family':'Lelli_et_al_2014_public_cube',
                           'profile_method':'published_UGC4483_20arcsec_10.4kms_3sigma_mask'})
          prof=pd.DataFrame(rows)
          # Independent QC: published pseudo-3sigma contour 2.7e20 cm^-2 and R_HI=1.4 kpc at 1 Msun/pc2.
          clean=prof[~prof.beam_smeared_mask & np.isfinite(prof.Sigma_HI_Msun_pc2)]
          # radial crossing estimate for 1 Msun/pc2
          rr=clean.r_kpc.to_numpy(); ss=clean.Sigma_HI_Msun_pc2.to_numpy(); crossing=np.nan
          inds=np.where((ss[:-1]>=1)&(ss[1:]<1))[0]
          if len(inds):
              i=inds[-1]; crossing=float(rr[i]+(1-ss[i])*(rr[i+1]-rr[i])/(ss[i+1]-ss[i]))
          qc=pd.DataFrame([{'name':'UGC04483','pix_arcsec':pix_as,'mask_sigma_xy_pix':sig_xy,'mask_sigma_v_chan':sig_v,'sigma_s_Jy_beam':sigs,
                            'dv_kms_from_header':dv,'mask_voxels':int(mask.sum()),'mask_sky_pixels':int(np.any(mask,axis=0).sum()),
                            'n_clean_annuli':len(clean),'rmin_kpc':float(clean.r_kpc.min()),'rmax_kpc':float(clean.r_kpc.max()),
                            'R_HI_1Msunpc2_reconstructed_kpc':crossing,'R_HI_published_kpc':1.4,'published_pseudo3sigma_NHI_cm2':2.7e20,
                            'median_positive_NHI_cm2':float(np.nanmedian(nhi[valid])),'max_NHI_cm2':float(np.nanmax(nhi))}])
          out=Path('/tmp/lelli_out');out.mkdir(exist_ok=True);prof.to_csv(out/'ugc04483_direct_hi_annular_profile.csv',index=False);qc.to_csv(out/'ugc04483_mask_qc.csv',index=False)
          fits.writeto(out/'ugc04483_reconstructed_NHI.fits',nhi,h,overwrite=True)
          print(qc.to_string(index=False)); print(clean[['r_kpc','Sigma_HI_Msun_pc2']].to_string(index=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lelli2014-reconstructed-hi-profiles
          path: /tmp/lelli_out
