name: Capture official FEASTS AnyShare public network v1
on:
  push:
    paths:
      - 'scripts/stationary/capture_feasts_anyshare_public_network_v1.py'
      - '.github/workflows/capture_feasts_anyshare_public_network_v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Capture fresh public-share flow
        run: python scripts/stationary/capture_feasts_anyshare_public_network_v1.py
      - name: Commit redacted public network audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/feasts_anyshare_public_network_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Capture FEASTS AnyShare public network v1'
          git pull --rebase origin main
          git push origin HEAD:main
