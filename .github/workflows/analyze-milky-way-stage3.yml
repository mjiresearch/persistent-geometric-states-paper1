name: Analyze Milky Way Stage 3 Rotation Residual

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze_milky_way_stage3_rotation_residual.py'
      - '.github/workflows/analyze-milky-way-stage3.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow scipy astropy galpy

      - name: Run Milky Way Stage 3 rotation-residual analysis
        id: stage3
        continue-on-error: true
        run: |
          mkdir -p data/persistence_history/milky_way_stage3
          set +e
          python scripts/analyze_milky_way_stage3_rotation_residual.py > data/persistence_history/milky_way_stage3/run_output.txt 2>&1
          code=$?
          echo "$code" > data/persistence_history/milky_way_stage3/exit_code.txt
          cat data/persistence_history/milky_way_stage3/run_output.txt
          exit $code

      - name: Show outputs
        if: always()
        run: |
          find data/persistence_history/milky_way_stage3 -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Commit Stage 3 outputs or diagnostics
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/persistence_history/milky_way_stage3/run_output.txt
          git add data/persistence_history/milky_way_stage3
          if git diff --cached --quiet; then
            echo 'No Stage 3 output changes to commit.'
          else
            git commit -m 'Add Milky Way Stage 3 rotation residual results'
            git push
          fi

      - name: Fail workflow if analysis failed
        if: steps.stage3.outcome == 'failure'
        run: exit 1
