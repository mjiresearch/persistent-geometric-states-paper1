name: Inspect Elson 2017 profile vectors

on:
  push:
    paths:
      - 'scripts/stationary/inspect_elson2017_profile_vectors.py'
      - '.github/workflows/inspect_elson2017_profile_vectors.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install vector PDF parser
        run: pip install --disable-pip-version-check pymupdf
      - name: Inspect Appendix vector objects
        run: python scripts/stationary/inspect_elson2017_profile_vectors.py
      - name: Commit vector-structure audit
        run: |
          git config user.name "mjiresearch"
          git config user.email "michael.iuliano.research@gmail.com"
          git add validation/stationary/elson2017_profile_vector_structure_v1.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Record Elson 2017 Appendix vector structure"
            git push
          fi
