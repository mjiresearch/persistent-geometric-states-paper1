name: Audit certified HI helium conventions

on:
  push:
    paths:
      - 'scripts/stationary/audit_certified_hi_helium_conventions.py'
      - '.github/workflows/audit_certified_hi_helium_conventions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stationary/audit_certified_hi_helium_conventions.py
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/certified_hi_helium_conventions_v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit certified HI helium conventions'
          git pull --rebase origin main
          git push origin HEAD:main
