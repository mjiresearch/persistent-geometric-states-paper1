name: Audit THINGS DDO154 zero blank semantics v1
on:
  push:
    paths:
      - 'scripts/stationary/audit_things_ddo154_zero_blank_semantics_v1.py'
      - '.github/workflows/audit_things_ddo154_zero_blank_semantics_v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy astropy
      - name: Run zero-blank semantics audit
        id: audit
        shell: bash
        run: |
          set +e
          python scripts/stationary/audit_things_ddo154_zero_blank_semantics_v1.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit audit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -f validation/stationary/things_ddo154_zero_blank_semantics_v1.json ]; then
            git add validation/stationary/things_ddo154_zero_blank_semantics_v1.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Audit DDO154 THINGS zero blank semantics v1'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report audit result
        run: echo "audit_exit_code=${{ steps.audit.outputs.exit_code }}"
