name: Audit Lelli2012b UGC4483 Figure 6 source
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/stationary/audit_lelli2012b_ugc4483_fig6_source.py'
      - '.github/workflows/audit_lelli2012b_ugc4483_fig6_source.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit source-native Figure 6 asset
        run: python scripts/stationary/audit_lelli2012b_ugc4483_fig6_source.py
      - name: Commit audit and source context
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/lelli2012b_ugc4483_fig6_source_audit_v1.json validation/stationary/lelli2012b_ugc4483_fig6_source_context_v1.txt
          if git diff --cached --quiet; then echo 'No changes'; else
            git commit -m 'Audit UGC4483 Figure 6 native source asset'
            for attempt in 1 2 3; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep 2; done
            exit 1
          fi
