name: Audit Ba05 NGC4559 HI profile

on:
  push:
    paths:
      - '.github/workflows/audit_ba05_ngc4559_hi_profile.yml'
      - 'scripts/stationary/audit_ba05_ngc4559_hi_profile.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Ba05 public-source audit
        run: python scripts/stationary/audit_ba05_ngc4559_hi_profile.py
      - name: Commit audit products
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/stationary/ba05_ngc4559_hi_profile_audit_v1.json validation/stationary/ba05_ngc4559_source_inventory_v1.txt
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Audit Ba05 NGC4559 public HI profile route'
            git push
          fi
