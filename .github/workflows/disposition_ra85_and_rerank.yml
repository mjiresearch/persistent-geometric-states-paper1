name: Disposition RA85 and rerank

on:
  push:
    paths:
      - 'scripts/stationary/disposition_ra85_ugc2885_public_profile_route.py'
      - '.github/workflows/disposition_ra85_and_rerank.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  disposition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record RA85 exact-public-route disposition
        run: python scripts/stationary/disposition_ra85_ugc2885_public_profile_route.py
      - name: Rerank Lelli source families
        run: python scripts/stationary/rank_sparc_hi_reference_families.py
      - name: Commit disposition and rerank race-safe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stationary/source_reconstruction/sparc_hi_reference_family_disposition_v1.csv \
                  data/stationary/source_reconstruction/sparc_hi_reference_family_priority_v1.csv \
                  validation/stationary/sparc_hi_reference_family_priority_v1_summary.json \
                  validation/stationary/CHECKPOINT_AFTER_RA85_DISPOSITION.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Disposition RA85 UGC2885 route and rerank'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python scripts/stationary/disposition_ra85_ugc2885_public_profile_route.py
            python scripts/stationary/rank_sparc_hi_reference_families.py
            git add data/stationary/source_reconstruction/sparc_hi_reference_family_disposition_v1.csv data/stationary/source_reconstruction/sparc_hi_reference_family_priority_v1.csv validation/stationary/sparc_hi_reference_family_priority_v1_summary.json validation/stationary/CHECKPOINT_AFTER_RA85_DISPOSITION.md
            git commit -m 'Disposition RA85 UGC2885 route and rerank' || true
            sleep 2
          done
          exit 1
