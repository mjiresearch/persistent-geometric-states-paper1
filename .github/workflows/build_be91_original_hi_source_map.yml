name: Build Be91 original HI source map

on:
  push:
    branches: [main]
    paths:
      - 'scripts/stationary/build_be91_original_hi_source_map.py'
      - 'validation/stationary/be91_original_hi_source_audit_v1.json'
      - '.github/workflows/build_be91_original_hi_source_map.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build source map from audited Be91 text
        run: python scripts/stationary/build_be91_original_hi_source_map.py
      - name: Commit source map
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stationary/source_reconstruction/be91_original_hi_source_map_v1.csv validation/stationary/be91_original_hi_source_map_v1_summary.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Build Be91 original HI source map'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
