name: Update stationary HI project ledger checkpoint

on:
  push:
    branches: [main]
    paths:
      - 'scripts/stationary/update_project_ledger_hi_checkpoint.py'
      - '.github/workflows/update_project_ledger_hi_checkpoint.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Update ledger checkpoint
        run: python scripts/stationary/update_project_ledger_hi_checkpoint.py
      - name: Commit ledger
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_LEDGER.md
          if git diff --cached --quiet; then
            echo 'Ledger already current'
          else
            git commit -m 'Update stationary HI project ledger checkpoint'
            git push
          fi
