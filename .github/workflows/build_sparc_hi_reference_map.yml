name: Build SPARC HI reference map

on:
  push:
    branches: [main]
    paths:
      - 'scripts/stationary/build_sparc_hi_reference_map.py'
      - 'validation/stationary/stationary_split_v1.csv'
      - '.github/workflows/build_sparc_hi_reference_map.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build frozen-149 reference map
        run: python scripts/stationary/build_sparc_hi_reference_map.py
      - name: Show summary
        run: cat validation/stationary/sparc_hi_reference_map_v1_summary.json
      - name: Commit reference products
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stationary/source_reconstruction/sparc_hi_reference_map_v1.csv validation/stationary/sparc_hi_reference_map_v1_summary.json
          if git diff --cached --quiet; then
            echo 'No product changes'
          else
            git commit -m 'Build frozen SPARC HI reference map'
            git push
          fi
