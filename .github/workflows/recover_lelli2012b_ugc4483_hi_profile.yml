name: Recover UGC4483 native vector HI profile
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/stationary/recover_lelli2012b_ugc4483_hi_profile.py'
      - '.github/workflows/recover_lelli2012b_ugc4483_hi_profile.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stationary/recover_lelli2012b_ugc4483_hi_profile.py
      - name: Commit recovered profile and checkpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stationary/source_reconstruction/lelli2012b_ugc4483_hi_profile_v1.csv validation/stationary/lelli2012b_ugc4483_hi_profile_recovery_v1.json validation/stationary/CHECKPOINT_UGC4483_HI_PROFILE_RECOVERED.md
          if git diff --cached --quiet; then echo 'No changes'; else
            git commit -m 'Recover UGC4483 native vector HI profile'
            for attempt in 1 2 3; do git pull --rebase origin main; if git push origin HEAD:main; then exit 0; fi; sleep 2; done
            exit 1
          fi
