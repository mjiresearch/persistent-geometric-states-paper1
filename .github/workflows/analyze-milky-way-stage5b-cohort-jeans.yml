name: Analyze Milky Way Stage 5B Cohort Jeans

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze_milky_way_stage5b_cohort_jeans.py'
      - '.github/workflows/analyze-milky-way-stage5b-cohort-jeans.yml'

permissions:
  contents: write

concurrency:
  group: milky-way-stage5b-cohort-jeans
  cancel-in-progress: true

jobs:
  stage5b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy pandas scipy
      - name: Run Stage 5B
        shell: bash
        run: |
          mkdir -p data/persistence_history/milky_way_stage5b_cohort_jeans
          set +e
          python scripts/analyze_milky_way_stage5b_cohort_jeans.py > data/persistence_history/milky_way_stage5b_cohort_jeans/run_output.txt 2>&1
          code=$?
          echo $code > data/persistence_history/milky_way_stage5b_cohort_jeans/exit_code.txt
          cat data/persistence_history/milky_way_stage5b_cohort_jeans/run_output.txt
          exit 0
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/persistence_history/milky_way_stage5b_cohort_jeans
          git diff --cached --quiet || git commit -m 'Add Milky Way Stage 5B cohort Jeans results'
          git pull --rebase origin main
          git push
