name: Inspect SDSS DR20 OSC target products
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/inspect_sdss_dr20_osc_spectra.py'
      - '.github/workflows/run-sdss-dr20-osc-product-inspection.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Inspect SDSS DR20 target products
        run: python data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/inspect_sdss_dr20_osc_spectra.py
      - name: Commit inspection products
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/persistence_history/hi4pi_grb_geometric_distance/cepheid_streaming_frozen/osc_rv_target_rank/sdss_dr20_recovery
          if ! git diff --cached --quiet; then
            git commit -m 'Record SDSS DR20 OSC spectrum product audit'
            git pull --rebase origin main
            git push
          fi
