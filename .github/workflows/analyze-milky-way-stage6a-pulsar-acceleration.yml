name: Analyze Milky Way Stage 6A Pulsar Acceleration

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/analyze_milky_way_stage6a_pulsar_acceleration_residual.py'
      - '.github/workflows/analyze-milky-way-stage6a-pulsar-acceleration.yml'

permissions:
  contents: write

concurrency:
  group: milky-way-stage6a-pulsar-acceleration
  cancel-in-progress: true

jobs:
  stage6a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas scipy galpy
      - name: Run Stage 6A
        shell: bash
        run: |
          mkdir -p data/persistence_history/milky_way_stage6a_pulsar_acceleration
          set +e
          python scripts/analyze_milky_way_stage6a_pulsar_acceleration_residual.py > data/persistence_history/milky_way_stage6a_pulsar_acceleration/run_output.txt 2>&1
          code=$?
          echo $code > data/persistence_history/milky_way_stage6a_pulsar_acceleration/exit_code.txt
          cat data/persistence_history/milky_way_stage6a_pulsar_acceleration/run_output.txt
          exit 0
      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/persistence_history/milky_way_stage6a_pulsar_acceleration
          git diff --cached --quiet || git commit -m 'Add Milky Way Stage 6A pulsar acceleration results'
          git pull --rebase origin main
          git push
# trigger 2026-08-08
