# Trigger exact identifier-overlap audit after workflow creation.
name: Audit DR20 identifier crosswalks

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_dr20_identifier_crosswalks.py'
      - '.github/workflows/audit-dr20-identifier-crosswalks.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow

      - name: Run crosswalk audit
        run: python scripts/audit_dr20_identifier_crosswalks.py

      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/persistence_history/dr20_crosswalk_audit
          if git diff --cached --quiet; then
            echo 'No crosswalk changes to commit.'
          else
            git commit -m 'Add DR20 identifier crosswalk audit results'
            git push
          fi
