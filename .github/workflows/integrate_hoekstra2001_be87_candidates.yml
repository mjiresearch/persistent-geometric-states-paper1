name: Integrate Hoekstra 2001 Be87 candidates
# Re-run from current main after frozen-role metadata corrections.

on:
  push:
    branches: [main]
    paths:
      - 'data/stationary/source_reconstruction/hoekstra2001_be87_hi_vector_profiles_candidate_v1.csv'
      - 'scripts/stationary/integrate_hoekstra2001_be87_candidates_into_overlay.py'
      - '.github/workflows/integrate_hoekstra2001_be87_candidates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate Be87 vector candidates
        run: python scripts/stationary/integrate_hoekstra2001_be87_candidates_into_overlay.py
      - name: Reconcile frozen provenance
        run: python scripts/stationary/reconcile_public_hi_source_overlay_v1.py
      - name: Rerank live Lelli source queue
        run: python scripts/stationary/rank_sparc_hi_reference_families.py
      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stationary/source_reconstruction/stationary_public_hi_source_overlay_v1.csv data/stationary/source_reconstruction/stationary_hi_profile_provenance_reconciled_v1.csv data/stationary/source_reconstruction/sparc_hi_reference_family_priority_v1.csv validation/stationary/stationary_hi_profile_provenance_reconciled_v1_summary.json validation/stationary/sparc_hi_reference_family_priority_v1_summary.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Integrate Hoekstra Be87 vector HI candidates'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 2
            done
            exit 1
          fi
